<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SE Quest | เกมตอบคำถามธุรกิจเพื่อสังคม</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@400;600;700&display=swap">
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<style>
:root {
  color-scheme: dark;
  --void: #0A0A0A; --panel: #17120C; --panel-2: #221a11;
  --ember: #EA8B25; --clay: #CC7021; --rust: #853F1A; --gold: #F5D96B;
  --cream: #EFD3A6; --bone: #F6F5F1; --olive: #6D912E; --poppy: #C1331D; --sky: #5DB8F0;
  --muted: #9a8a74;
  --f-th: "Prompt", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  --f-px: "Press Start 2P", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--void); color: var(--bone); font-family: var(--f-th); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; }
button:disabled { opacity: .45; cursor: default; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }
[hidden] { display: none !important; }
.px { font-family: var(--f-px); letter-spacing: .04em; }
.btn { background: var(--ember); color: var(--void); border: 0; box-shadow: 4px 4px 0 var(--rust); font-weight: 700; font-size: 18px; padding: 14px 18px; }
.btn:active:not(:disabled) { transform: translate(2px, 2px); box-shadow: 2px 2px 0 var(--rust); }
.btn.ghost { background: var(--panel-2); color: var(--bone); box-shadow: 4px 4px 0 #000; border: 2px solid #3a2d1e; }
.btn.danger { background: var(--poppy); color: var(--bone); box-shadow: 4px 4px 0 #5a160c; }
.btn.ok { background: var(--olive); color: var(--bone); box-shadow: 4px 4px 0 #34460f; }
input[type=text], input[type=number] { font: inherit; font-size: 20px; padding: 12px 14px; background: #000; color: var(--bone); border: 3px solid var(--ember); width: 100%; }

/* ---------- chooser ---------- */
.chooser { min-height: 100%; display: grid; place-items: center; padding: 32px 16px; }
.chooser-inner { width: min(820px, 100%); display: grid; gap: 24px; }
.chooser h1 { margin: 0; font-size: clamp(36px, 7vw, 64px); line-height: 1.1; }
.chooser h1 span { color: var(--ember); display: block; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; }
.role { text-align: left; background: var(--panel); color: var(--bone); border: 4px solid var(--ember); box-shadow: 6px 6px 0 var(--rust); padding: 18px 20px; display: grid; gap: 6px; }
.role b { font-size: 24px; }
.role small { color: var(--cream); font-size: 15px; line-height: 1.5; }

/* ---------- connection badge ---------- */
.conn { position: fixed; right: 10px; bottom: 10px; z-index: 50; font-size: 12px; padding: 4px 8px; background: #000; border: 2px solid var(--olive); color: var(--olive); }
.conn.bad { border-color: var(--poppy); color: var(--poppy); }

/* ---------- player (phone) ---------- */
.pl { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: 12px max(14px, env(safe-area-inset-left)) 24px max(14px, env(safe-area-inset-right)); gap: 14px; }
.pl-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; background: var(--panel); border: 3px solid var(--ember); padding: 10px 12px; }
.pl-top .me { min-width: 0; }
.pl-top .me b { display: block; font-size: 17px; overflow-wrap: anywhere; }
.pl-top .me span { font-size: 13px; color: var(--cream); }
.pl-score { text-align: right; }
.pl-score .v { font-family: var(--f-px); font-size: 22px; color: var(--gold); }
.pl-score .l { font-size: 12px; color: var(--muted); }
.pl-clock { font-family: var(--f-px); font-size: 14px; color: var(--bone); background: #000; border: 2px solid #3a2d1e; padding: 6px 8px; white-space: nowrap; }
.pl-clock.low { color: var(--poppy); border-color: var(--poppy); }
.meter { display: flex; align-items: center; gap: 8px; font-size: 14px; color: var(--cream); }
.meter i { width: 26px; height: 14px; background: #2a2016; border: 2px solid #4a3a28; display: inline-block; }
.meter i.on { background: var(--gold); border-color: var(--gold); }
.card { background: var(--panel); border: 4px solid var(--ember); box-shadow: 6px 6px 0 var(--rust); padding: 18px; }
.qno { font-size: 13px; color: var(--gold); margin-bottom: 8px; }
.qtext { font-size: 21px; font-weight: 700; line-height: 1.45; margin: 0; overflow-wrap: anywhere; }
.opts { display: grid; gap: 10px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 58px; padding: 10px 14px; font-size: 18px; color: var(--bone); background: var(--panel-2); border: 3px solid #4a3a28; box-shadow: 4px 4px 0 #000; overflow-wrap: anywhere; }
.opt .k { flex: none; width: 34px; height: 34px; display: grid; place-items: center; font-family: var(--f-px); font-size: 13px; background: var(--ember); color: var(--void); }
.opt.right { background: #2d3f12; border-color: var(--olive); }
.opt.right .k { background: var(--olive); color: var(--bone); }
.opt.wrong { background: #3d140c; border-color: var(--poppy); }
.opt.wrong .k { background: var(--poppy); color: var(--bone); }
.fb { text-align: center; display: grid; gap: 12px; }
.fb .big { font-size: 34px; font-weight: 700; }
.fb .why { font-size: 16px; line-height: 1.6; color: var(--cream); text-align: left; background: #000; padding: 12px 14px; border-left: 4px solid var(--gold); }
.center-msg { text-align: center; display: grid; gap: 14px; padding: 28px 16px; }
.center-msg h2 { margin: 0; font-size: 26px; }
.center-msg p { margin: 0; color: var(--cream); line-height: 1.6; }
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.box { aspect-ratio: 1 / 1.1; display: grid; place-items: center; align-content: center; gap: 6px; background: var(--rust); border: 4px solid var(--gold); box-shadow: 5px 5px 0 #000; color: var(--bone); font-size: 15px; padding: 6px; }
.box .ico { font-size: 40px; line-height: 1; }
.box:not(:disabled):hover { transform: translateY(-3px); }
.box.open { background: var(--panel-2); border-color: #4a3a28; }
.box.mine { border-color: var(--ember); background: #3a2410; outline: 3px solid var(--gold); }
.box .lbl { font-weight: 700; text-align: center; line-height: 1.3; }
.shake { animation: shake .5s steps(6) 2; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-4px) rotate(-3deg); } 75% { transform: translateX(4px) rotate(3deg); } }
.targets { display: grid; gap: 8px; max-height: 52vh; overflow: auto; }
.tg { display: flex; justify-content: space-between; gap: 10px; align-items: center; text-align: left; padding: 12px 14px; font-size: 17px; color: var(--bone); background: var(--panel-2); border: 3px solid #4a3a28; }
.tg span:first-child { min-width: 0; overflow-wrap: anywhere; }
.tg b { font-family: var(--f-px); font-size: 13px; color: var(--gold); flex: none; }
.toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); z-index: 60; background: var(--poppy); color: var(--bone); border: 3px solid var(--bone); box-shadow: 5px 5px 0 #000; padding: 14px 16px; font-size: 18px; font-weight: 700; text-align: center; animation: drop .25s ease-out; }
.toast.good { background: var(--olive); }
@keyframes drop { from { transform: translate(-50%, -30px); opacity: 0; } }
.rank-list { display: grid; gap: 6px; }
.rank-row { display: grid; grid-template-columns: 44px 1fr auto; gap: 10px; align-items: center; padding: 8px 12px; background: var(--panel-2); border: 2px solid #3a2d1e; }
.rank-row.me { border-color: var(--gold); }
.rank-row .n { font-family: var(--f-px); font-size: 13px; color: var(--gold); }
.rank-row .nm { overflow-wrap: anywhere; }
.rank-row .s { font-family: var(--f-px); font-size: 12px; }

/* ---------- screen (projector) ---------- */
.stage-wrap { position: fixed; inset: 0; display: grid; place-items: center; overflow: hidden; background: var(--void); }
.stage-in { position: absolute; inset: 0; padding: 48px 56px; display: grid; grid-template-rows: auto 1fr; gap: 28px; }
.stage { width: 1920px; height: 1080px; position: relative; flex: none; transform-origin: center;
  background-image: linear-gradient(#ffffff06 2px, transparent 2px), linear-gradient(90deg, #ffffff06 2px, transparent 2px); background-size: 48px 48px; }
.s-head { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.s-title { display: grid; gap: 10px; }
.s-title .px { font-size: 20px; color: var(--gold); }
.s-title h1 { margin: 0; font-size: 64px; line-height: 1.05; }
.s-title h1 span { color: var(--ember); }
.s-clock { font-family: var(--f-px); font-size: 72px; padding: 18px 28px; background: #000; border: 6px solid var(--ember); box-shadow: 8px 8px 0 var(--rust); min-width: 360px; text-align: center; }
.s-clock.low { color: var(--poppy); border-color: var(--poppy); animation: pulse 1s steps(2) infinite; }
@keyframes pulse { 50% { color: var(--bone); } }
.s-stat { font-size: 26px; color: var(--cream); text-align: right; }
.s-stat b { font-family: var(--f-px); font-size: 40px; color: var(--gold); display: block; margin-bottom: 8px; }
.s-body { display: grid; grid-template-columns: 1fr 640px; gap: 40px; min-height: 0; }
.panel { background: var(--panel); border: 6px solid var(--ember); box-shadow: 10px 10px 0 var(--rust); padding: 28px 32px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 18px; }
.panel h2 { margin: 0; font-size: 34px; display: flex; justify-content: space-between; align-items: baseline; }
.panel h2 small { font-size: 22px; color: var(--muted); font-weight: 400; }
.lobby-join { display: grid; grid-template-columns: 440px 1fr; gap: 40px; align-items: center; }
.qr { width: 440px; height: 440px; background: var(--bone); padding: 18px; display: grid; place-items: center; border: 6px solid var(--gold); }
.qr svg { width: 100%; height: 100%; display: block; }
.join-steps { display: grid; gap: 22px; font-size: 34px; line-height: 1.4; }
.join-steps .url { font-size: 22px; color: var(--gold); overflow-wrap: anywhere; font-family: monospace; }
.chips { display: flex; flex-wrap: wrap; gap: 10px; align-content: flex-start; overflow: hidden; }
.chip { font-size: 22px; padding: 6px 14px; background: var(--panel-2); border: 3px solid #4a3a28; max-width: 280px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.new { animation: pop .3s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } }
.board { display: grid; gap: 8px; }
.brow { display: grid; grid-template-columns: 90px 1fr 200px; align-items: center; gap: 18px; height: 60px; padding: 0 22px; background: var(--panel-2); border: 3px solid #3a2d1e; font-size: 30px; transition: transform .5s; }
.brow .r { font-family: var(--f-px); font-size: 24px; color: var(--muted); }
.brow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 600; }
.brow .sc { font-family: var(--f-px); font-size: 28px; text-align: right; color: var(--gold); }
.brow.top1 { border-color: var(--gold); background: #3a2a0e; }
.brow.top1 .r, .brow.top2 .r, .brow.top3 .r, .brow.top4 .r, .brow.top5 .r { color: var(--ember); }
.brow.flash { animation: flash .8s steps(4); }
@keyframes flash { 50% { background: var(--ember); color: var(--void); } }
.feed { display: grid; gap: 12px; align-content: start; }
.fd { font-size: 24px; line-height: 1.4; padding: 12px 16px; background: var(--panel-2); border-left: 8px solid var(--muted); }
.fd.prank { border-color: var(--poppy); }
.fd.swap { border-color: var(--sky); }
.fd.gain { border-color: var(--olive); }
.fd.lose { border-color: var(--clay); }
.fd b { color: var(--gold); font-weight: 700; }
.blast { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 20; min-width: 1100px; max-width: 1600px; text-align: center; padding: 48px 64px; background: #000; border: 10px solid var(--poppy); box-shadow: 16px 16px 0 #5a160c; font-size: 64px; font-weight: 700; line-height: 1.3; animation: blast .35s ease-out; }
.blast.swap { border-color: var(--sky); box-shadow: 16px 16px 0 #1d4d6b; }
.blast .px { display: block; font-size: 28px; color: var(--gold); margin-bottom: 18px; }
@keyframes blast { from { transform: translate(-50%, -50%) scale(.4); opacity: 0; } }
.podium { display: grid; gap: 16px; }
.pod { display: grid; grid-template-columns: 140px 1fr 260px; align-items: center; gap: 24px; padding: 18px 32px; background: var(--panel-2); border: 5px solid #4a3a28; font-size: 44px; animation: pop .5s ease-out both; }
.pod .r { font-family: var(--f-px); font-size: 40px; color: var(--ember); }
.pod .nm { font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pod .sc { font-family: var(--f-px); font-size: 36px; color: var(--gold); text-align: right; }
.pod.p1 { border-color: var(--gold); background: #3a2a0e; font-size: 56px; padding: 26px 32px; }
.pod.p1 .r { color: var(--gold); }
.empty { color: var(--muted); font-size: 26px; }

/* ---------- MC ---------- */
.mc { max-width: 760px; margin: 0 auto; padding: 16px max(14px, env(safe-area-inset-left)) 40px max(14px, env(safe-area-inset-right)); display: grid; gap: 16px; }
.mc h1 { margin: 0; font-size: 26px; }
.mc .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.mc .row > .btn { flex: 1 1 160px; }
.mc .stat { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.mc .stat div { background: var(--panel); border: 3px solid #3a2d1e; padding: 10px 12px; }
.mc .stat b { display: block; font-family: var(--f-px); font-size: 18px; color: var(--gold); margin-top: 6px; }
.mc label { font-size: 15px; color: var(--cream); display: grid; gap: 6px; }
.mc .plist { display: grid; gap: 6px; }
.mc .prow { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 12px; background: var(--panel); border: 2px solid #3a2d1e; }
.mc .prow span { min-width: 0; overflow-wrap: anywhere; }
.mc .prow button { font-size: 13px; padding: 6px 10px; }
.mc .note { font-size: 14px; color: var(--muted); line-height: 1.6; }
.mc a { color: var(--gold); overflow-wrap: anywhere; }
</style>
</head>

var qrcode = function() {

  //---------------------------------------------------------------------
  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }

        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;

        count += 1;

        throw count + ' != ' + numChars;
      }

      return unicodeMap;

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {

              bytes.push(b & 0xff);

          }

  del(k) { try { sessionStorage.removeItem(k); } catch (e) {} },
} : store;
const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const rid = (n = 10) => { const c = 'abcdefghijkmnpqrstuvwxyz23456789'; let s = ''; for (let i = 0; i < n; i++) s += c[Math.floor(Math.random() * c.length)]; return s; };
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmtClock = (ms) => { ms = Math.max(0, ms); const s = Math.ceil(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); };

/* ---------- ชั้นฐานข้อมูล: Firebase จริง หรือโหมดทดสอบในเครื่อง (?local=1) ---------- */
function makeFirebaseDB() {
  const fc = window.FIREBASE_CONFIG;
  if (!firebase.apps.length) firebase.initializeApp(fc);
  const db = firebase.database();
  const root = db.ref('rooms/' + ROOM);
  let offset = 0, connected = false;
  const connCbs = [];
  db.ref('.info/serverTimeOffset').on('value', (s) => { offset = s.val() || 0; });
  db.ref('.info/connected').on('value', (s) => { connected = !!s.val(); connCbs.forEach((f) => f(connected)); });
  return {
    now: () => Date.now() + offset,
    onConn: (f) => { connCbs.push(f); f(connected); },
    on: (path, cb) => { const r = root.child(path); const h = (s) => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    onLast: (path, n, cb) => { const r = root.child(path).limitToLast(n); const h = (s) => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    get: (path) => root.child(path).once('value').then((s) => s.val()),
    set: (path, v) => root.child(path).set(v),
    update: (path, v) => root.child(path).update(v),
    remove: (path) => root.child(path).remove(),
    push: (path, v) => root.child(path).push(v),
    tx: (path, fn) => root.child(path).transaction(fn).then((r) => ({ committed: r.committed, value: r.snapshot.val() })),
    stamp: () => firebase.database.ServerValue.TIMESTAMP,
  };
}
function makeLocalDB() {
  const KEY = 'seq-local-' + ROOM;
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;
  const subs = new Set();
  const read = () => { try { return JSON.parse(store.get(KEY) || '{}'); } catch (e) { return {}; } };
  const parts = (p) => p.split('/').filter(Boolean);
  const getAt = (t, p) => parts(p).reduce((o, k) => (o == null ? null : (o[k] === undefined ? null : o[k])), t);
  const setAt = (t, p, v) => {
    const ks = parts(p); let o = t;
    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const write = (fn) => { const t = read(); fn(t); store.set(KEY, JSON.stringify(t)); fire(); if (bc) bc.postMessage(1); };
  const fire = () => { const t = read(); subs.forEach((s) => s(t)); };
  if (bc) bc.onmessage = fire;
  window.addEventListener('storage', (e) => { if (e.key === KEY) fire(); });
  const sub = (fn) => { subs.add(fn); setTimeout(() => fn(read()), 0); return () => subs.delete(fn); };
  const lastN = (v, n) => { if (!v) return null; const ks = Object.keys(v).sort().slice(-n); const o = {}; ks.forEach((k) => { o[k] = v[k]; }); return o; };
  let pushSeq = 0;
  return {
    now: () => Date.now(),
    onConn: (f) => f(true),
    on: (path, cb) => { let last; return sub((t) => { const v = getAt(t, path); const j = JSON.stringify(v); if (j !== last) { last = j; cb(v == null ? null : JSON.parse(j)); } }); },
    onLast: (path, n, cb) => { let last; return sub((t) => { const v = lastN(getAt(t, path), n); const j = JSON.stringify(v); if (j !== last) { last = j; cb(v); } }); },
    get: async (path) => getAt(read(), path),
    set: async (path, v) => write((t) => setAt(t, path, JSON.parse(JSON.stringify(v)))),
    update: async (path, obj) => write((t) => { for (const [k, v] of Object.entries(obj)) setAt(t, path + '/' + k, v); }),
    remove: async (path) => write((t) => setAt(t, path, null)),
    push: async (path, v) => { const k = Date.now().toString(36).padStart(9, '0') + (pushSeq++).toString(36).padStart(3, '0') + rid(4); write((t) => setAt(t, path + '/' + k, v)); return { key: k }; },
    tx: async (path, fn) => { let out = { committed: false, value: null }; write((t) => { const cur = getAt(t, path); const nv = fn(cur == null ? null : JSON.parse(JSON.stringify(cur))); if (nv === undefined) { out = { committed: false, value: cur }; return; } setAt(t, path, nv); out = { committed: true, value: nv }; }); return out; },
    stamp: () => Date.now(),
  };
}
let DB;
try { DB = (LOCAL || !window.FIREBASE_CONFIG || !window.firebase) ? makeLocalDB() : makeFirebaseDB(); }
catch (e) { console.error(e); DB = makeLocalDB(); }

function showConn() {
  const el = document.getElementById('conn');
  DB.onConn((ok) => { el.hidden = false; el.className = 'conn' + (ok ? '' : ' bad'); el.textContent = LOCAL ? 'โหมดทดสอบในเครื่อง' : (ok ? 'ออนไลน์' : 'หลุดการเชื่อมต่อ กำลังต่อใหม่'); });
}

/* ---------- ข้อมูลในห้อง ----------
   rooms/ROOM/game    {phase: lobby|play|end, startAt, endAt, mins, gid}
   rooms/ROOM/players/{pid} {n, j}
   rooms/ROOM/sc/{pid}      แต้ม (ตัวเลข)
   rooms/ROOM/st/{pid}      {c: ถูกกี่ข้อ, a: ตอบกี่ข้อ}
   rooms/ROOM/feed/{push}   {k, f, fn, t, tn, d, at}
*/
function rankOf(players, sc) {
  const list = Object.entries(players || {}).map(([id, p]) => ({ id, n: (p && p.n) || '???', s: (sc && sc[id]) || 0, j: (p && p.j) || 0 }));
  list.sort((a, b) => b.s - a.s || a.j - b.j);
  return list;
}
function feedText(f) {
  const a = '<b>' + esc(f.fn) + '</b>', b = '<b>' + esc(f.tn) + '</b>';
  if (f.k === 'prank') return '🎯 ' + a + ' แกล้ง ' + b + ' ลบ ' + RULES.prank + ' แต้ม';
  if (f.k === 'swap') return '🔄 ' + a + ' สวอปแต้มกับ ' + b + ' (' + f.d + ')';
  if (f.k === 'gain') return '💰 ' + a + ' เปิดกล่องได้ +' + RULES.gain;
  if (f.k === 'lose') return '💸 ' + a + ' เปิดกล่องเจอ -' + RULES.lose;
  return '';
}

/* ================= ผู้เล่น (มือถือ) ================= */
function startPlayer() {
  const app = document.getElementById('app');
  let pid = pstore.get('seq-pid-' + ROOM);
  if (!pid) { pid = rid(12); pstore.set('seq-pid-' + ROOM, pid); }
  let myName = pstore.get('seq-name-' + ROOM) || '';
  let game = null, players = {}, sc = {}, joined = false;
  // สถานะในเครื่อง: คิวคำถามของเรา ขั้นตอนบนหน้าจอ
  let deck = [], deckGid = null, cur = null;
  let view = 'question';   // question | feedback | boxes | target | done
  let fbData = null, boxData = null, tgKind = null, tgFilter = '';
  let myStat = { c: 0, a: 0 };
  let busy = false;
  const seenFeed = new Set(); let feedReady = false;

  function loadDeck(gid) {
    const raw = pstore.get('seq-deck-' + ROOM);
    try { const d = JSON.parse(raw || 'null'); if (d && d.gid === gid && Array.isArray(d.q)) { deck = d.q; deckGid = gid; cur = d.cur; boxData = d.box || null; if (boxData) view = boxData.picked == null ? 'boxes' : (boxData.done ? 'question' : 'target'); if (view === 'target') tgKind = boxData.kinds[boxData.picked]; return; } } catch (e) {}
    deck = shuffle([...QUESTIONS.keys()]); deckGid = gid; cur = deck.shift(); boxData = null; view = 'question'; saveDeck();
  }
  const saveDeck = () => pstore.set('seq-deck-' + ROOM, JSON.stringify({ gid: deckGid, q: deck, cur, box: boxData }));
  function nextQ() { if (!deck.length) deck = shuffle([...QUESTIONS.keys()].filter((i) => i !== cur)); cur = deck.shift(); saveDeck(); }

  DB.on('game', (g) => {
    game = g;
    if (g && g.gid && g.gid !== deckGid) { loadDeck(g.gid); myStat = { c: 0, a: 0 }; }
    render();
  });
  DB.on('players', (p) => { players = p || {}; joined = !!players[pid]; if (!joined && myName && pstore.get('seq-joined-' + ROOM) === '1') { /* โดน MC ลบออก */ pstore.del('seq-joined-' + ROOM); } render(); });
  DB.on('sc', (s) => { sc = s || {}; render(); });
  DB.on('st/' + pid, (s) => { if (s) myStat = s; });
  DB.onLast('feed', 15, (f) => {
    const items = Object.entries(f || {});
    for (const [k, v] of items) {
      if (seenFeed.has(k)) continue;
      seenFeed.add(k);
      if (!feedReady || !v || v.t !== pid) continue;
      if (v.k === 'prank') toast('🎯 ' + v.fn + ' แกล้งคุณ ลบ ' + RULES.prank + ' แต้ม!');
      if (v.k === 'swap') toast('🔄 ' + v.fn + ' สวอปแต้มกับคุณ! (' + v.d + ')', v.up);
    }
    feedReady = true;
  });

  let toastT;
  function toast(msg, good) {
    let el = document.querySelector('.toast');
    if (!el) { el = document.createElement('div'); document.body.appendChild(el); }
    el.className = 'toast' + (good ? ' good' : ''); el.textContent = msg;
    if (navigator.vibrate) try { navigator.vibrate([120, 60, 120]); } catch (e) {}
    clearTimeout(toastT); toastT = setTimeout(() => el.remove(), 3500);
  }

  async function join(name) {
    name = name.trim().replace(/\s+/g, ' ').slice(0, 16);
    if (!name) return;
    myName = name; pstore.set('seq-name-' + ROOM, name); pstore.set('seq-joined-' + ROOM, '1');
    await DB.update('', { ['players/' + pid]: { n: name, j: DB.stamp() } });
    await DB.tx('sc/' + pid, (v) => (v == null ? 0 : v));
  }

  async function answer(i) {
    if (busy || view !== 'question' || !game || game.phase !== 'play') return;
    if (DB.now() > game.endAt) return;
    busy = true;
    const q = QUESTIONS[cur];
    const ok = i === q.a;
    fbData = { pick: i, ok, q: cur, until: Date.now() + (ok ? 900 : RULES.wrongPauseMs) };
    view = 'feedback'; render();
    myStat = { c: myStat.c + (ok ? 1 : 0), a: myStat.a + 1 };
    DB.set('st/' + pid, myStat);
    if (ok) await DB.tx('sc/' + pid, (v) => (v || 0) + RULES.correct);
    const earnBox = ok && myStat.c % RULES.every === 0;
    nextQ();
    if (earnBox) { boxData = { kinds: [0, 1, 2].map(() => BOX_KINDS[Math.floor(Math.random() * BOX_KINDS.length)]), picked: null, done: false }; saveDeck(); }
    busy = false;
    const wait = fbData.until - Date.now();
    setTimeout(() => { if (view === 'feedback') { view = boxData && !boxData.done ? 'boxes' : 'question'; render(); } }, Math.max(0, wait));
    render();
  }

  async function pickBox(i) {
    if (!boxData || boxData.picked != null || busy) return;
    busy = true;
    boxData.picked = i; saveDeck();
    const kind = boxData.kinds[i];
    render();
    await new Promise((r) => setTimeout(r, 900));
    if (kind === 'gain' || kind === 'lose') {
      const d = kind === 'gain' ? RULES.gain : -RULES.lose;
      await DB.tx('sc/' + pid, (v) => Math.max(0, (v || 0) + d));
      DB.push('feed', { k: kind, f: pid, fn: myName, at: DB.stamp() });
      boxData.done = true; boxData.result = kind; saveDeck();
      busy = false; render();
      setTimeout(() => { if (boxData && boxData.done) { boxData = null; saveDeck(); view = 'question'; render(); } }, 1800);
    } else {
      busy = false; tgKind = kind; tgFilter = ''; view = 'target'; render();
    }
  }

  async function pickTarget(tid) {
    if (busy || !boxData) return;
    if (!game || game.phase !== 'play') return;
    busy = true;
    const tn = (players[tid] && players[tid].n) || '???';
    let detail = '', up = false;
    if (tgKind === 'prank') {
      await DB.tx('sc/' + tid, (v) => Math.max(0, (v || 0) - RULES.prank));
    } else {
      // สวอปทั้งก้อน ทำในธุรกรรมเดียวกันทั้งสองคน
      const r = await DB.tx('sc', (all) => {
        all = all || {};
        const a = all[pid] || 0, b = all[tid] || 0;
        detail = a + ' ↔ ' + b; up = a > b;
        all[pid] = b; all[tid] = a;
        return all;
      });
      if (!r.committed) { busy = false; toast('สวอปไม่สำเร็จ ลองอีกครั้ง'); return; }
    }
    DB.push('feed', { k: tgKind, f: pid, fn: myName, t: tid, tn, d: detail, up, at: DB.stamp() });
    boxData = null; saveDeck(); tgKind = null;
    busy = false; view = 'question'; render();
  }

  function myRank() { const r = rankOf(players, sc); const i = r.findIndex((x) => x.id === pid); return { list: r, i }; }

  function topBar() {
    const left = game && game.phase === 'play' ? game.endAt - DB.now() : null;
    return `<div class="pl-top">
      <div class="me"><b>${esc(myName)}</b><span>${joined ? 'อันดับ ' + (myRank().i + 1) + ' จาก ' + Object.keys(players).length + ' คน' : ''}</span></div>
      ${left != null ? `<div class="pl-clock ${left < 30000 ? 'low' : ''}" id="pclock">${fmtClock(left)}</div>` : ''}
      <div class="pl-score"><div class="v">${(sc[pid] || 0)}</div><div class="l">แต้ม</div></div>
    </div>`;
  }
  function meter() {
    const n = myStat.c % RULES.every;
    let s = ''; for (let i = 0; i < RULES.every; i++) s += `<i class="${i < n ? 'on' : ''}"></i>`;
    return `<div class="meter">${s}<span>ตอบถูกอีก ${RULES.every - n} ข้อ เปิดกล่องสุ่ม</span></div>`;
  }

  function render() {
    if (!joined) {
      const inGame = game && game.phase === 'play';
      app.innerHTML = `<div class="pl"><div class="center-msg card">
        <div class="px" style="color:var(--gold);font-size:12px">SE QUEST</div>
        <h2>ใส่ชื่อเล่นเพื่อเข้าเกม</h2>
        <p>${inGame ? 'เกมเริ่มไปแล้ว เข้าได้เลย รีบตอบตามให้ทัน!' : 'รอ MC กดเริ่มเกมพร้อมกันทั้งห้อง'}</p>
        <form id="jf" style="display:grid;gap:12px"><input id="jn" type="text" maxlength="16" placeholder="ชื่อเล่น" value="${esc(myName)}" autocomplete="off" enterkeyhint="go"><button class="btn" type="submit">เข้าเกม</button></form>
      </div></div>`;
      const f = document.getElementById('jf');
      f.onsubmit = (e) => { e.preventDefault(); join(document.getElementById('jn').value); };
      return;
    }
    if (!game || game.phase === 'lobby') {
      app.innerHTML = `<div class="pl">${topBar()}<div class="center-msg card"><h2>เข้าเกมแล้ว!</h2><p>มองขึ้นจอใหญ่ รอ MC กดเริ่ม<br>ตอบถูกได้ ${RULES.correct} แต้ม ถูกครบ ${RULES.every} ข้อได้เปิดกล่องสุ่ม<br>ในกล่องมีทั้งแต้มเพิ่ม แต้มหาย แกล้งเพื่อน และสวอปแต้ม</p></div></div>`;
      return;
    }
    if (game.phase === 'end' || DB.now() > game.endAt) {
      const { list, i } = myRank();
      const rows = list.slice(0, 5).map((r, k) => `<div class="rank-row ${r.id === pid ? 'me' : ''}"><span class="n">#${k + 1}</span><span class="nm">${esc(r.n)}</span><span class="s">${r.s}</span></div>`).join('');
      app.innerHTML = `<div class="pl">${topBar()}<div class="center-msg card"><h2>หมดเวลา!</h2><p>คุณได้อันดับ <b style="color:var(--gold)">${i + 1}</b> ด้วย ${sc[pid] || 0} แต้ม</p></div><div class="rank-list">${rows}</div></div>`;
      return;
    }
    if (view === 'feedback' && fbData) {
      const q = QUESTIONS[fbData.q];
      const opts = q.o.map((o, k) => `<div class="opt ${k === q.a ? 'right' : (k === fbData.pick ? 'wrong' : '')}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></div>`).join('');
      app.innerHTML = `<div class="pl">${topBar()}<div class="card fb"><div class="big" style="color:${fbData.ok ? 'var(--olive)' : 'var(--poppy)'}">${fbData.ok ? 'ถูกต้อง! +' + RULES.correct : 'ยังไม่ใช่'}</div>${fbData.ok ? '' : `<div class="why">${esc(q.w)}</div>`}</div>${fbData.ok ? '' : `<div class="opts">${opts}</div>`}</div>`;
      return;
    }
    if (view === 'boxes' && boxData) {
      const done = boxData.picked != null;
      const bx = boxData.kinds.map((k, i) => {
        const info = BOX_INFO[k];
        if (!done) return `<button class="box" data-b="${i}"><span class="ico">🎁</span><span class="lbl">กล่อง ${i + 1}</span></button>`;
        const mine = i === boxData.picked;
        return `<div class="box open ${mine ? 'mine' : ''}"><span class="ico">${info.ico}</span><span class="lbl">${esc(info.lbl)}</span></div>`;
      }).join('');
      const res = done ? BOX_INFO[boxData.kinds[boxData.picked]] : null;
      app.innerHTML = `<div class="pl">${topBar()}<div class="card center-msg"><h2>${done ? res.ico + ' ' + esc(res.lbl) : 'เลือกเปิด 1 กล่อง'}</h2><p>${done ? 'กล่องอื่นมีอะไร ดูได้ข้างล่าง' : 'ดวงล้วนๆ ข้างในมีทั้งดีและร้าย'}</p></div><div class="boxes">${bx}</div></div>`;
      app.querySelectorAll('[data-b]').forEach((b) => { b.onclick = () => pickBox(+b.dataset.b); b.classList.add('shake'); });
      return;
    }
    if (view === 'target') {
      const others = rankOf(players, sc).filter((r) => r.id !== pid);
      const f = tgFilter.trim().toLowerCase();
      const shown = others.filter((r) => !f || r.n.toLowerCase().includes(f));
      const title = tgKind === 'prank' ? '🎯 เลือกคนที่จะแกล้ง ลบ ' + RULES.prank + ' แต้ม' : '🔄 เลือกคนที่จะสวอปแต้มด้วย';
      const sub = tgKind === 'prank' ? 'แต้มของเขาจะลดลง (ไม่ต่ำกว่า 0)' : 'แต้มของคุณ ' + (sc[pid] || 0) + ' จะสลับกับแต้มของเขาทั้งก้อน';
      app.innerHTML = `<div class="pl">${topBar()}<div class="card center-msg" style="padding:18px"><h2 style="font-size:22px">${title}</h2><p>${sub}</p></div>
        ${others.length > 8 ? `<input id="tf" type="text" placeholder="ค้นหาชื่อ" value="${esc(tgFilter)}" autocomplete="off">` : ''}
        <div class="targets">${shown.length ? shown.map((r) => `<button class="tg" data-t="${esc(r.id)}"><span>${esc(r.n)}</span><b>${r.s}</b></button>`).join('') : '<p class="center-msg">ยังไม่มีผู้เล่นคนอื่น</p>'}</div>
        ${others.length ? '' : '<button class="btn ghost" id="skipt">ข้ามไปก่อน</button>'}</div>`;
      app.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => pickTarget(b.dataset.t); });
      const tf = document.getElementById('tf');
      if (tf) { tf.oninput = () => { tgFilter = tf.value; const pos = tf.selectionStart; render(); const n = document.getElementById('tf'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }; }
      const sk = document.getElementById('skipt');
      if (sk) sk.onclick = () => { boxData = null; saveDeck(); view = 'question'; render(); };
      return;
    }
    // คำถาม
    const q = QUESTIONS[cur];
    if (!q) { nextQ(); return render(); }
    app.innerHTML = `<div class="pl">${topBar()}${meter()}<div class="card"><div class="qno px">ข้อที่ ${myStat.a + 1}</div><p class="qtext">${esc(q.q)}</p></div>
      <div class="opts">${q.o.map((o, k) => `<button class="opt" data-o="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
    app.querySelectorAll('[data-o]').forEach((b) => { b.onclick = () => answer(+b.dataset.o); });
  }

  setInterval(() => {
    const el = document.getElementById('pclock');
    if (!game || game.phase !== 'play') return;
    const left = game.endAt - DB.now();
    if (left <= 0) { if (view !== 'target' || true) render(); return; }
    if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left < 30000); }
  }, 500);
  render();
}

/* ================= จอโชว์ (โปรเจกเตอร์) ================= */
function startScreen() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="stage-wrap"><div class="stage" id="stage"><div class="stage-in" id="stage-in"></div></div></div>`;
  const stage = document.getElementById('stage');
  const content = document.getElementById('stage-in');
  const fit = () => { const k = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = 'scale(' + k + ')'; };
  addEventListener('resize', fit); fit();
  let game = null, players = {}, sc = {}, feed = [];
  const seen = new Set(); let feedReady = false; let lastTop = {};
  const blasts = []; let blasting = false;

  DB.on('game', (g) => { game = g; render(); });
  DB.on('players', (p) => { players = p || {}; render(); });
  DB.on('sc', (s) => { sc = s || {}; render(); });
  DB.onLast('feed', 8, (f) => {
    const items = Object.entries(f || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1));
    feed = items.map(([, v]) => v).filter(Boolean).reverse();
    for (const [k, v] of items) {
      if (seen.has(k)) continue; seen.add(k);
      if (feedReady && v && (v.k === 'prank' || v.k === 'swap') && game && game.phase === 'play') blasts.push(v);
    }
    feedReady = true; runBlast(); render();
  });
  function runBlast() {
    if (blasting || !blasts.length) return;
    blasting = true;
    const v = blasts.shift();
    const el = document.createElement('div');
    el.className = 'blast' + (v.k === 'swap' ? ' swap' : '');
    el.innerHTML = v.k === 'prank'
      ? `<span class="px">PRANK!</span>🎯 ${esc(v.fn)} แกล้ง ${esc(v.tn)}<br>ลบ ${RULES.prank} แต้ม`
      : `<span class="px">SWAP!</span>🔄 ${esc(v.fn)} สวอปกับ ${esc(v.tn)}<br>${esc(v.d)}`;
    stage.appendChild(el);
    setTimeout(() => { el.remove(); blasting = false; runBlast(); }, blasts.length > 2 ? 1200 : 2200);
  }

  let qrCache = {};
  function qrSVG(url) {
    if (qrCache[url]) return qrCache[url];
    try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qrCache[url] = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); }
    catch (e) { qrCache[url] = '<div style="color:#000;font-size:24px">' + esc(url) + '</div>'; }
    return qrCache[url];
  }
  const chipSeen = new Set();
  const playerURL = () => { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('role', 'player'); if (ROOM !== 'ROYALE26') u.searchParams.set('room', ROOM); if (LOCAL) u.searchParams.set('local', '1'); return u.toString(); };

  function head(extra) {
    return `<div class="s-head"><div class="s-title"><div class="px">SE QUEST · ธุรกิจเพื่อสังคม</div><h1>ตอบให้ไว <span>แกล้งให้มัน</span></h1></div>${extra || ''}</div>`;
  }
  function render() {
    const n = Object.keys(players).length;
    const phase = game ? game.phase : 'lobby';
    if (phase === 'lobby') {
      const chips = Object.entries(players).sort((a, b) => (a[1].j || 0) - (b[1].j || 0)).map(([id, p]) => { const nw = !chipSeen.has(id); chipSeen.add(id); return `<span class="chip ${nw ? 'new' : ''}">${esc(p.n)}</span>`; }).join('');
      const url = playerURL();
      content.innerHTML = head(`<div class="s-stat"><b>${n}</b>คนเข้าเกมแล้ว</div>`) + `<div class="s-body">
        <div class="panel"><div class="lobby-join"><div class="qr">${qrSVG(url)}</div>
        <div class="join-steps"><div>1. สแกน QR ด้วยมือถือ</div><div>2. ใส่ชื่อเล่น</div><div>3. รอ MC กดเริ่ม</div><div class="url">${esc(url)}</div></div></div>
        <div style="font-size:26px;color:var(--cream);line-height:1.6">ตอบถูกได้ ${RULES.correct} แต้ม · ถูกครบ ${RULES.every} ข้อ ได้เปิดกล่องสุ่ม 💰 💸 🎯 🔄 · หมดเวลา 5 อันดับแรกชนะ</div></div>
        <div class="panel"><h2>ผู้เล่น <small>${n} คน</small></h2><div class="chips">${chips || '<span class="empty">ยังไม่มีใครเข้า สแกนเลย!</span>'}</div></div></div>`;
      return;
    }
    const list = rankOf(players, sc);
    if (phase === 'end') {
      const pods = list.slice(0, 5).map((r, i) => `<div class="pod p${i + 1}" style="animation-delay:${(4 - i) * 0.35}s"><span class="r">#${i + 1}</span><span class="nm">${esc(r.n)}</span><span class="sc">${r.s}</span></div>`).join('');
      content.innerHTML = head(`<div class="s-stat"><b>${n}</b>คนร่วมเล่น</div>`) + `<div class="s-body" style="grid-template-columns:1fr">
        <div class="panel"><h2>🏆 5 อันดับแรก <small>หมดเวลาแล้ว!</small></h2><div class="podium">${pods || '<span class="empty">ไม่มีผู้เล่น</span>'}</div></div></div>`;
      return;
    }
    const left = game.endAt - DB.now();
    const top = list.slice(0, 10);
    const rows = top.map((r, i) => { const fl = lastTop[r.id] != null && lastTop[r.id] !== r.s; return `<div class="brow ${i < 5 ? 'top' + (i + 1) : ''} ${fl ? 'flash' : ''}"><span class="r">#${i + 1}</span><span class="nm">${esc(r.n)}</span><span class="sc">${r.s}</span></div>`; }).join('');
    lastTop = {}; top.forEach((r) => { lastTop[r.id] = r.s; });
    const fd = feed.slice(0, 7).map((f) => `<div class="fd ${esc(f.k)}">${feedText(f)}</div>`).join('');
    content.innerHTML = head(`<div class="s-stat"><b>${n}</b>คนกำลังเล่น</div><div class="s-clock ${left < 30000 ? 'low' : ''}" id="sclock">${fmtClock(left)}</div>`) + `<div class="s-body">
      <div class="panel"><h2>อันดับสด <small>5 อันดับแรกตอนหมดเวลาชนะ</small></h2><div class="board">${rows || '<span class="empty">รอผู้เล่นตอบข้อแรก</span>'}</div></div>
      <div class="panel"><h2>เกิดอะไรขึ้นบ้าง</h2><div class="feed">${fd || '<span class="empty">ยังไม่มีใครเปิดกล่อง</span>'}</div></div></div>`;
  }
  setInterval(() => {
    if (!game || game.phase !== 'play') return;
    const left = game.endAt - DB.now();
    // จอโชว์ปิดเกมเองเมื่อหมดเวลา เผื่อจอ MC ไม่ได้เปิดค้างไว้
    if (left < -800) { DB.tx('game', (g) => { if (g && g.phase === 'play' && DB.now() > g.endAt) g.phase = 'end'; return g; }); return; }
    const el = document.getElementById('sclock');
    if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left < 30000); }
  }, 250);
  render();
}

/* ================= จอ MC ================= */
function startMC() {
  const app = document.getElementById('app');
  let game = null, players = {}, sc = {};
  let mins = +(store.get('seq-mins') || RULES.defaultMinutes);
  DB.on('game', (g) => { game = g; render(); });
  DB.on('players', (p) => { players = p || {}; render(); });
  DB.on('sc', (s) => { sc = s || {}; render(); });

  async function startGame() {
    const m = Math.min(30, Math.max(1, +document.getElementById('mins').value || RULES.defaultMinutes));
    mins = m; store.set('seq-mins', String(m));
    const now = DB.now();
    const zero = {}; Object.keys(players).forEach((id) => { zero[id] = 0; });
    await DB.set('sc', zero);
    await DB.remove('st');
    await DB.remove('feed');
    await DB.set('game', { phase: 'play', startAt: now, endAt: now + m * 60000, mins: m, gid: rid(8) });
  }
  async function addMin() { if (!game || game.phase !== 'play') return; await DB.tx('game', (g) => { if (!g) return g; g.endAt += 60000; return g; }); }
  async function endNow() { if (!game) return; if (!confirmBtn('end')) return; await DB.tx('game', (g) => { if (!g) return g; g.phase = 'end'; g.endAt = Math.min(g.endAt, DB.now()); return g; }); }
  async function toLobby() { if (!confirmBtn('lobby')) return; await DB.set('game', { phase: 'lobby', gid: null }); await DB.remove('feed'); }
  async function wipe() { if (!confirmBtn('wipe')) return; await DB.remove('players'); await DB.remove('sc'); await DB.remove('st'); await DB.remove('feed'); await DB.set('game', { phase: 'lobby' }); }
  async function kick(id) { await DB.remove('players/' + id); await DB.remove('sc/' + id); await DB.remove('st/' + id); }
  // ปุ่มที่ล้างข้อมูลต้องกดสองครั้ง (ไม่ใช้ confirm() ของเบราว์เซอร์)
  const armed = {};
  function confirmBtn(k) { if (armed[k] && Date.now() - armed[k] < 4000) { armed[k] = 0; return true; } armed[k] = Date.now(); render(); setTimeout(render, 4100); return false; }
  const lbl = (k, a, b) => (armed[k] && Date.now() - armed[k] < 4000 ? b : a);

  // หมดเวลาแล้ว MC เป็นคนปิดเกมให้ จอทุกจอจะเปลี่ยนเป็นหน้าอันดับ
  setInterval(() => {
    if (game && game.phase === 'play' && DB.now() > game.endAt + 300) DB.tx('game', (g) => { if (g && g.phase === 'play' && DB.now() > g.endAt) g.phase = 'end'; return g; });
    const el = document.getElementById('mclock');
    if (el && game && game.phase === 'play') el.textContent = fmtClock(game.endAt - DB.now());
  }, 500);

  function render() {
    const phase = game ? game.phase : 'lobby';
    const list = rankOf(players, sc);
    const base = new URL(location.href); base.search = '';
    const mk = (role) => { const u = new URL(base); u.searchParams.set('role', role); if (ROOM !== 'ROYALE26') u.searchParams.set('room', ROOM); if (LOCAL) u.searchParams.set('local', '1'); return u.toString(); };
    const active = document.activeElement && document.activeElement.id === 'mins';
    if (active) return;
    app.innerHTML = `<div class="mc">
      <h1>จอ MC · SE Quest</h1>
      <div class="stat"><div>สถานะ<b>${phase === 'play' ? 'กำลังเล่น' : phase === 'end' ? 'จบแล้ว' : 'รอเริ่ม'}</b></div><div>ผู้เล่น<b>${list.length}</b></div><div>เวลาเหลือ<b id="mclock">${phase === 'play' ? fmtClock(game.endAt - DB.now()) : '-'}</b></div></div>
      ${phase !== 'play' ? `<label>ความยาวเกม (นาที)<input id="mins" type="number" min="1" max="30" value="${mins}" inputmode="numeric"></label>
        <div class="row"><button class="btn ok" id="go" ${list.length ? '' : 'disabled'}>เริ่มเกม (รีเซ็ตแต้มทุกคนเป็น 0)</button></div>` : ''}
      ${phase === 'play' ? `<div class="row"><button class="btn ghost" id="add1">ต่อเวลา +1 นาที</button><button class="btn danger" id="end">${lbl('end', 'จบเกมเดี๋ยวนี้', 'กดอีกครั้งเพื่อจบ')}</button></div>` : ''}
      ${phase === 'end' ? `<div class="row"><button class="btn ghost" id="lobby">${lbl('lobby', 'กลับหน้ารอ (เก็บรายชื่อไว้)', 'กดอีกครั้งเพื่อยืนยัน')}</button></div>` : ''}
      <div class="row"><button class="btn danger" id="wipe">${lbl('wipe', 'ล้างห้อง เริ่มรอบใหม่ทั้งหมด', 'กดอีกครั้ง ลบผู้เล่นทุกคน')}</button></div>
      <p class="note">ขั้นตอนต่อรอบ: ล้างห้อง ให้น้องสแกน QR บนจอ เห็นชื่อครบแล้วกดเริ่มเกม หมดเวลาแล้วระบบจบเกมเองและขึ้น 5 อันดับบนจอ<br>
      จอโชว์: <a href="${mk('screen')}" target="_blank">${esc(mk('screen'))}</a><br>ลิงก์ผู้เล่น: <a href="${mk('player')}" target="_blank">${esc(mk('player'))}</a></p>
      <h1 style="font-size:20px">ผู้เล่น (${list.length})</h1>
      <div class="plist">${list.map((r, i) => `<div class="prow"><span>#${i + 1} ${esc(r.n)} · <b>${r.s}</b></span><button class="btn ghost" data-k="${esc(r.id)}">เอาออก</button></div>`).join('') || '<p class="note">ยังไม่มีผู้เล่น</p>'}</div>
    </div>`;
    const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
    on('go', startGame); on('add1', addMin); on('end', endNow); on('lobby', toLobby); on('wipe', wipe);
    app.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => kick(b.dataset.k); });
  }
  render();
}

/* ================= เลือกบทบาท ================= */
function chooser() {
  const app = document.getElementById('app');
  const go = (r) => { const u = new URL(location.href); u.searchParams.set('role', r); location.href = u.toString(); };
  app.innerHTML = `<div class="chooser"><div class="chooser-inner">
    <div class="px" style="color:var(--gold);font-size:12px">SE QUEST · ห้อง ${esc(ROOM)}</div>
    <h1>เกมตอบคำถาม<span>ธุรกิจเพื่อสังคม</span></h1>
    <div class="roles">
      <button class="role" data-r="screen"><b>จอโชว์</b><small>เปิดบนคอมที่ต่อโปรเจกเตอร์ โชว์ QR อันดับสด และ 5 อันดับตอนจบ</small></button>
      <button class="role" data-r="mc"><b>จอ MC</b><small>เริ่มเกม ต่อเวลา จบเกม ล้างห้อง</small></button>
      <button class="role" data-r="player"><b>ผู้เล่น</b><small>สำหรับมือถือ ปกติให้สแกน QR บนจอแทน</small></button>
    </div></div></div>`;
  app.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => go(b.dataset.r); });
}

(function boot() {
  showConn();
  const role = qs.get('role');
  if (role === 'screen') startScreen();
  else if (role === 'mc') startMC();
  else if (role === 'player') startPlayer();
  else chooser();
})();
</script>
</body>
