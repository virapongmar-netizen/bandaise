<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>[hidden]{display:none!important}</style></head><body><title>บันไดธุรกิจ พิชิตสังคม</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Prompt:wght@400;600;700&display=swap"><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script><script src="config.js"></script>
<style>
/* เลย์เอาต์: จอโชว์เป็นเวที 1920x1080 ย่อขยายทั้งก้อน กระดานซ้าย แผงทีมขวา / จอควบคุมเป็นหน้าเว็บธรรมดาคอลัมน์เดียว
   ธีม: Impact District CI พื้นดำสนิท ส้มเป็นสีหลัก พิกเซลยุค 16 บิต (ตั้งใจเป็นธีมมืดธีมเดียว) */
:root {
  color-scheme: dark;
  --void: #0A0A0A;
  --panel: #17120C;
  --panel-2: #221a11;
  --ember: #EA8B25;
  --clay: #CC7021;
  --rust: #853F1A;
  --gold: #F5D96B;
  --cream: #EFD3A6;
  --bone: #F6F5F1;
  --olive: #6D912E;
  --poppy: #C1331D;
  --muted: #9a8a74;
  --f-th: "Prompt", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  --f-en: "Poppins", "Prompt", sans-serif;
  --f-px: "Press Start 2P", "Courier New", monospace;
}
html, body { height: 100%; }
body { background: var(--void); color: var(--bone); font-family: var(--f-th); margin: 0; }
button { font-family: inherit; }
:focus-visible { outline: 3px solid var(--gold); outline-offset: 2px; }

/* ---------- หน้าเลือกบทบาท ---------- */
.chooser { min-height: 100%; display: grid; place-items: center; padding-block: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
.chooser-inner { width: min(820px, 100%); display: grid; gap: 28px; }
.eyebrow { font-family: var(--f-px); font-size: 12px; letter-spacing: .08em; color: var(--gold); line-height: 1.8; }
.chooser h1 { margin: 0; font-size: clamp(40px, 7vw, 72px); line-height: 1.1; font-weight: 700; text-wrap: balance; }
.chooser h1 span { color: var(--ember); display: block; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 16px; }
.role { text-align: left; background: var(--panel); color: var(--bone); border: 4px solid var(--ember); box-shadow: 6px 6px 0 var(--rust); padding: 20px 22px; cursor: pointer; display: grid; gap: 8px; min-width: 0; }
.role:hover { background: var(--panel-2); transform: translate(-2px, -2px); box-shadow: 8px 8px 0 var(--rust); }
.role b { font-size: 26px; font-weight: 700; }
.role small { font-size: 15px; color: var(--cream); line-height: 1.5; }
.role .px { font-family: var(--f-px); font-size: 11px; color: var(--gold); }
.mode-note { font-size: 15px; color: var(--muted); line-height: 1.6; border-top: 2px dashed var(--rust); padding-top: 16px; }
.mode-note b { color: var(--cream); font-weight: 600; }
.roomrow { display: grid; gap: 8px; }
.roomrow label { font-size: 16px; color: var(--cream); }
.roomrow input { font-family: var(--f-px); font-size: 22px; letter-spacing: .12em; padding: 12px 14px; background: var(--void); color: var(--gold); border: 3px solid var(--ember); width: 220px; max-width: 100%; text-transform: uppercase; }
.mode-note.blocked { border: 3px solid var(--poppy); background: #2a0f0a; padding: 16px; color: var(--bone); display: grid; gap: 10px; }
.mode-note.blocked b { color: #ff8a73; font-size: 18px; }
.mode-note.blocked ol { margin: 0; padding-left: 22px; display: grid; gap: 4px; }

/* ---------- จอโชว์ ---------- */
.screen-wrap { position: fixed; inset: 0; overflow: hidden; background: var(--void); }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; transform-origin: 0 0; overflow: hidden; background: var(--void); }
#board-svg { position: absolute; left: 0; top: 0; }
#board-svg text { font-family: var(--f-th); }
.pieces { position: absolute; inset: 0; pointer-events: none; }
.piece { position: absolute; left: 0; top: 0; width: 72px; height: 96px; margin: -60px 0 0 -36px; transition: transform .28s steps(6); will-change: transform; }
.piece.moving { transition: none; z-index: 5; }
.piece svg { display: block; filter: drop-shadow(3px 0 0 var(--bone)) drop-shadow(-3px 0 0 var(--bone)) drop-shadow(0 3px 0 var(--bone)) drop-shadow(0 -3px 0 var(--bone)) drop-shadow(0 6px 0 rgba(0,0,0,.6)); }
.piece .no { position: absolute; left: 50%; top: -6px; transform: translateX(-50%); font-family: var(--f-px); font-size: 16px; padding: 5px 6px 4px; border: 3px solid var(--void); color: var(--void); line-height: 1; }

.side { position: absolute; left: 1196px; top: 48px; width: 676px; height: 984px; display: flex; flex-direction: column; gap: 18px; }
.brand { display: grid; gap: 6px; }
.brand .eyebrow { font-size: 15px; }
.brand h2 { margin: 0; font-size: 58px; line-height: 1.08; font-weight: 700; }
.brand h2 span { color: var(--ember); display: block; }
.teams { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tcard { position: relative; background: var(--panel); border: 5px solid var(--rust); padding: 10px 14px 10px 100px; height: 120px; box-sizing: border-box; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.tcard .avatar { position: absolute; left: 14px; top: 13px; width: 72px; height: 84px; }
.tcard .avatar svg { filter: drop-shadow(3px 0 0 var(--bone)) drop-shadow(-3px 0 0 var(--bone)) drop-shadow(0 3px 0 var(--bone)) drop-shadow(0 -3px 0 var(--bone)); }
.tcard .nm { font-size: 32px; font-weight: 600; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tcard .sq { font-family: var(--f-px); font-size: 22px; color: var(--gold); line-height: 1.4; display: flex; align-items: center; gap: 6px; }
.tcard .sq small { font-family: var(--f-th); font-size: 24px; color: var(--cream); margin-right: 2px; }
.stopbadge { font-family: var(--f-th); font-size: 20px; font-weight: 700; background: #5DB8F0; color: var(--void); padding: 0 8px; margin-left: 10px; line-height: 1.5; }
.tcard.turn { border-color: var(--ember); background: #2a1a0b; animation: blink 0.9s steps(2) infinite; }
.tcard.turn::after { content: "ถึงตา"; position: absolute; right: -5px; top: -5px; background: var(--ember); color: var(--void); font-size: 18px; font-weight: 700; padding: 0 10px; }
.tcard.dim { opacity: .35; }
@keyframes blink { 50% { border-color: var(--gold); } }
.statusbox { margin-top: auto; background: var(--panel); border: 5px solid var(--ember); box-shadow: 8px 8px 0 var(--rust); display: grid; grid-template-columns: 150px 1fr; gap: 22px; align-items: center; padding: 18px 22px; height: 220px; box-sizing: border-box; }
.dice { width: 150px; height: 150px; position: relative; }
.dice svg { width: 100%; height: 100%; display: block; }
.dice.spin { animation: spin .22s steps(4) infinite; }
@keyframes spin { 0% { transform: rotate(0) translateY(0); } 25% { transform: rotate(14deg) translateY(-14px); } 50% { transform: rotate(0) translateY(0); } 75% { transform: rotate(-14deg) translateY(-8px); } }
.dice.land { animation: land .35s steps(5); }
@keyframes land { 0% { transform: scale(1.25); } 100% { transform: scale(1); } }
.status-txt { display: grid; gap: 8px; min-width: 0; }
.status-txt .big { font-size: 44px; font-weight: 700; line-height: 1.15; color: var(--bone); }
.status-txt .big .tn { color: var(--ember); }
.status-txt .sub { font-size: 30px; color: var(--cream); line-height: 1.3; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 18px; font-size: 24px; color: var(--cream); }
.legend span { display: flex; align-items: center; gap: 10px; white-space: nowrap; }
.legend i { width: 26px; height: 26px; display: inline-block; box-sizing: border-box; flex: none; }

.toast { position: absolute; left: 600px; top: 540px; transform: translate(-50%, -50%) scale(.6); background: var(--ember); color: var(--void); font-size: 56px; font-weight: 700; padding: 18px 44px; border: 6px solid var(--void); box-shadow: 10px 10px 0 var(--rust); opacity: 0; transition: opacity .15s, transform .25s steps(4); white-space: nowrap; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, -50%) scale(1); }
.toast.bad { background: var(--poppy); color: var(--bone); }
.toast.good { background: var(--olive); color: var(--bone); }

.overlay { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(10,10,10,.82); z-index: 30; opacity: 0; pointer-events: none; transition: opacity .25s; }
.overlay.on { opacity: 1; }
.overlay.board-only { right: 744px; }

.card { width: 1360px; background: var(--panel); border: 8px solid var(--ember); box-shadow: 14px 14px 0 var(--rust); transform: perspective(1400px) rotateY(80deg); transition: transform .45s steps(6); }
.overlay.on .card { transform: perspective(1400px) rotateY(0); }
.card-head { display: flex; align-items: center; gap: 24px; padding: 18px 30px; background: var(--gold); color: var(--void); }
.card.shoot .card-head { background: var(--clay); color: var(--void); }
.card-head .kind { display: grid; gap: 6px; }
.card-head .kind span { font-family: var(--f-px); font-size: 16px; line-height: 1.4; }
.card-head .kind b { font-size: 34px; line-height: 1.1; }
.card-head .who { font-size: 40px; font-weight: 700; margin-left: auto; text-align: right; line-height: 1.15; display: flex; align-items: center; gap: 18px; }
.card-head .who small { display: block; font-size: 26px; font-weight: 600; }
.card-head .who .av svg { display: block; filter: drop-shadow(3px 0 0 var(--bone)) drop-shadow(-3px 0 0 var(--bone)) drop-shadow(0 3px 0 var(--bone)) drop-shadow(0 -3px 0 var(--bone)); }
#pill-time { font-variant-numeric: tabular-nums; }
.card-body { display: grid; grid-template-columns: 1fr 190px; gap: 30px; padding: 32px 36px 20px; }
.card-q { font-size: 50px; line-height: 1.3; font-weight: 600; text-wrap: balance; margin: 0; }
.card-rule { font-size: 32px; font-weight: 600; color: var(--cream); margin-top: 10px; }
.timer { width: 190px; height: 190px; position: relative; }
.timer svg { width: 100%; height: 100%; }
.timer .num { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-px); font-size: 44px; color: var(--gold); }
.timer.warn .num { color: var(--poppy); animation: pulse .5s steps(2) infinite; }
.timer.out .num { font-family: var(--f-th); font-size: 30px; font-weight: 700; color: var(--poppy); text-align: center; line-height: 1.1; }
@keyframes pulse { 50% { transform: scale(1.15); } }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 0 36px 26px; }
.opt { display: grid; grid-template-columns: 64px 1fr; align-items: center; gap: 18px; background: var(--void); border: 4px solid var(--rust); padding: 14px 18px; min-height: 110px; box-sizing: border-box; transition: opacity .3s, background .3s; }
.opt .l { width: 64px; height: 64px; display: grid; place-items: center; background: var(--ember); color: var(--void); font-family: var(--f-px); font-size: 26px; }
.opt .t { font-size: 36px; line-height: 1.25; min-width: 0; }
.card.revealed .opt { opacity: .32; }
.card.revealed .opt.ok { opacity: 1; background: var(--olive); border-color: var(--bone); }
.card.revealed .opt.ok .l { background: var(--bone); }
.verdict { display: none; margin: 0 36px 30px; padding: 18px 24px; gap: 8px; border: 4px solid var(--bone); }
.card.revealed .verdict { display: grid; }
.verdict b { font-size: 40px; line-height: 1.2; }
.verdict p { margin: 0; font-size: 30px; line-height: 1.4; color: var(--bone); }
.verdict.right { background: #24310f; }
.verdict.wrong { background: #3a120b; }

.order-box { width: 1000px; display: grid; gap: 26px; }
.order-box h3 { margin: 0; font-size: 60px; text-align: center; }
.order-box .sub { text-align: center; font-size: 34px; color: var(--cream); margin-top: -12px; }
.order-list { display: grid; gap: 14px; }
.order-row { display: grid; grid-template-columns: 90px 1fr auto; align-items: center; gap: 24px; background: var(--panel); border: 5px solid var(--rust); padding: 6px 22px; height: 96px; box-sizing: border-box; animation: rowin .4s steps(4) both; }
.order-row:nth-child(2) { animation-delay: .12s; } .order-row:nth-child(3) { animation-delay: .24s; } .order-row:nth-child(4) { animation-delay: .36s; } .order-row:nth-child(5) { animation-delay: .48s; }
@keyframes rowin { from { opacity: 0; transform: translateX(-60px); } }
.order-row .av svg { display: block; }
.order-row.next { border-color: var(--ember); }
.order-row .rank { font-family: var(--f-px); font-size: 30px; color: var(--gold); }
.order-row .nm { font-size: 40px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.order-row .rolls { font-family: var(--f-px); font-size: 30px; color: var(--bone); display: flex; gap: 14px; }
.order-row .rolls i { font-style: normal; opacity: .4; }
.order-row .rolls i:last-child { opacity: 1; }

.splash { text-align: center; display: grid; gap: 18px; }
.splash .eyebrow { font-size: 20px; }
.splash h1 { margin: 0; font-size: 130px; line-height: 1.05; font-weight: 700; }
.splash h1 span { color: var(--ember); display: block; }
.splash p { margin: 0; font-size: 36px; color: var(--cream); }

.win { text-align: center; display: grid; gap: 10px; justify-items: center; z-index: 2; }
.win .eyebrow { font-size: 26px; }
.win h1 { margin: 0; font-size: 150px; line-height: 1; color: var(--gold); font-weight: 700; }
.win .nm { font-size: 80px; font-weight: 700; }
.win p { margin: 0; font-size: 32px; color: var(--cream); }
.win .big-avatar { width: 216px; height: 288px; animation: hop .6s steps(3) infinite alternate; }
@keyframes hop { to { transform: translateY(-26px); } }
#confetti { position: absolute; inset: 0; pointer-events: none; z-index: 1; }

.corner { position: fixed; right: max(14px, env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 8px; z-index: 50; transition: opacity .4s; }
.corner.hide { opacity: 0; pointer-events: none; }
.corner button, .netnote { background: var(--panel); color: var(--cream); border: 2px solid var(--rust); font-size: 14px; padding: 8px 12px; cursor: pointer; }
.card.timeout { border-color: var(--poppy); animation: tflash .5s steps(2) 6; }
@keyframes tflash { 50% { border-color: var(--bone); box-shadow: 14px 14px 0 var(--poppy); } }
.fshint { position: fixed; left: 50%; top: calc(16px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); background: var(--ember); color: var(--void); font-size: 18px; font-weight: 600; padding: 12px 18px; border: 3px solid var(--void); z-index: 60; max-width: calc(100% - 32px); box-sizing: border-box; text-align: center; }
.netnote { position: fixed; left: max(14px, env(safe-area-inset-left, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px)); cursor: default; z-index: 50; }
.screen-wrap.nocursor { cursor: none; }

/* ---------- เอฟเฟกต์แกล้งกัน ---------- */
.fxlayer { position: absolute; inset: 0; pointer-events: none; z-index: 12; }
.flash { position: absolute; inset: 0; pointer-events: none; z-index: 11; opacity: 0; }
.flash.red { background: radial-gradient(circle at 600px 540px, rgba(193,51,29,0) 30%, rgba(193,51,29,.75) 100%); }
.flash.green { background: radial-gradient(circle at 600px 540px, rgba(109,145,46,0) 30%, rgba(109,145,46,.7) 100%); }
.flash.white { background: #F6F5F1; }
.flash.ice { background: radial-gradient(circle at 600px 540px, rgba(93,184,240,0) 30%, rgba(93,184,240,.7) 100%); }
.flash.on { animation: flashout .7s steps(5) forwards; }
@keyframes flashout { 0% { opacity: 1; } 100% { opacity: 0; } }
.quake { animation: quake .6s steps(8); }
@keyframes quake { 0% { translate: 0 0; } 15% { translate: -18px 8px; } 30% { translate: 16px -10px; } 45% { translate: -12px 6px; } 60% { translate: 10px -4px; } 75% { translate: -6px 4px; } 100% { translate: 0 0; } }
.piece.hurt > div { animation: shake .12s steps(2) 5; }
.piece.hurt svg, .piece.reverse svg { filter: drop-shadow(4px 0 0 #ff3b1f) drop-shadow(-4px 0 0 #ff3b1f) drop-shadow(0 4px 0 #ff3b1f) drop-shadow(0 -4px 0 #ff3b1f); }
.piece.hurt .no { animation: blink2 .2s steps(2) infinite; }
@keyframes shake { 0% { transform: translateX(-9px) rotate(-6deg); } 100% { transform: translateX(9px) rotate(6deg); } }
.piece.glow svg { filter: drop-shadow(4px 0 0 #F5D96B) drop-shadow(-4px 0 0 #F5D96B) drop-shadow(0 4px 0 #F5D96B) drop-shadow(0 -4px 0 #F5D96B); }
.piece.frozen svg { filter: drop-shadow(3px 0 0 #5DB8F0) drop-shadow(-3px 0 0 #5DB8F0) drop-shadow(0 3px 0 #5DB8F0) drop-shadow(0 -3px 0 #5DB8F0) saturate(.3) brightness(1.2); }
.piece.frozen::after { content: "ZZ"; position: absolute; right: -14px; top: 10px; font-family: var(--f-px); font-size: 16px; color: #5DB8F0; animation: blink2 1s steps(2) infinite; }
.floattxt { position: absolute; transform: translate(-50%, 0); font-family: var(--f-px); font-size: 40px; color: var(--gold); text-shadow: 4px 4px 0 var(--void), -3px -3px 0 var(--void); animation: floatup 1.5s steps(10) forwards; white-space: nowrap; }
.floattxt.bad { color: #ff5a3c; font-size: 56px; }
.floattxt.ice { color: #5DB8F0; font-family: var(--f-th); font-weight: 700; font-size: 46px; }
@keyframes floatup { 0% { opacity: 0; translate: 0 30px; } 15% { opacity: 1; translate: 0 0; } 80% { opacity: 1; } 100% { opacity: 0; translate: 0 -70px; } }
.bitesnake { position: absolute; width: 140px; height: 140px; margin: -150px 0 0 -70px; animation: snakepop 1.1s steps(6) forwards; }
@keyframes snakepop { 0% { transform: translateY(120px) scale(.3); opacity: 0; } 30% { transform: translateY(0) scale(1.15); opacity: 1; } 45% { transform: translateY(50px) scale(1); } 60% { transform: translateY(0) scale(1.2); } 85% { opacity: 1; } 100% { transform: translateY(20px) scale(1); opacity: 0; } }
.boom { position: absolute; width: 0; height: 0; }
.boom::before { content: ""; position: absolute; left: -40px; top: -40px; width: 80px; height: 80px; background: #F5D96B; box-shadow: 0 0 0 16px #EA8B25, 0 0 0 32px #C1331D; animation: boomcore .9s steps(6) forwards; }
.boom i { position: absolute; left: -12px; top: -12px; width: 24px; height: 24px; background: #EA8B25; transform: rotate(var(--a)) translateY(0); animation: debris .9s steps(8) forwards; }
.boom i:nth-child(3n) { background: #F5D96B; } .boom i:nth-child(3n+1) { background: #C1331D; }
@keyframes boomcore { 0% { transform: scale(.2); } 40% { transform: scale(3.2); opacity: 1; } 100% { transform: scale(4.2); opacity: 0; } }
@keyframes debris { 0% { transform: rotate(var(--a)) translateY(0); opacity: 1; } 100% { transform: rotate(var(--a)) translateY(calc(var(--d) * -1)); opacity: 0; } }
/* ---------- วงล้อลงโทษ ---------- */
.wheel-box { display: grid; justify-items: center; gap: 14px; }
.wheel-title { display: flex; align-items: center; gap: 16px; font-size: 48px; font-weight: 700; color: var(--bone); }
.wheel-title .av svg { display: block; filter: drop-shadow(3px 0 0 var(--bone)) drop-shadow(-3px 0 0 var(--bone)) drop-shadow(0 3px 0 var(--bone)) drop-shadow(0 -3px 0 var(--bone)); }
.wheel-svg .bulb { fill: #F5D96B; animation: bulbs .5s steps(2) infinite; }
.wheel-svg .bulb.b2 { animation-delay: .25s; }
@keyframes bulbs { 50% { fill: #853F1A; } }
.wheel-svg path.win { animation: segwin .3s steps(2) infinite; }
@keyframes segwin { 50% { fill: #F6F5F1; } }
.wheel-res { min-height: 84px; font-size: 60px; font-weight: 700; padding: 4px 40px; border: 6px solid var(--void); box-shadow: 8px 8px 0 var(--rust); display: grid; justify-items: center; line-height: 1.2; visibility: hidden; }
.wheel-res.bad, .wheel-res.good { visibility: visible; animation: land .35s steps(5); }
.wheel-res.bad { background: var(--poppy); color: var(--bone); }
.wheel-res.good { background: var(--olive); color: var(--bone); }
.wheel-res small { font-size: 30px; font-weight: 600; }
.unlock { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 70; background: var(--gold); color: var(--void); font-size: 20px; font-weight: 700; padding: 12px 22px; border: 3px solid var(--void); cursor: pointer; animation: blink2 1.2s steps(2) infinite; }

/* ---------- จอควบคุม ---------- */
.ctl { max-width: 1080px; margin: 0 auto; padding-block: 18px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: grid; gap: 18px; }
.ctl-top { display: flex; flex-wrap: wrap; gap: 10px 16px; align-items: center; }
.ctl-top h1 { margin: 0; font-size: 22px; font-weight: 700; margin-right: auto; }
.ctl-top h1 span { color: var(--ember); }

/* ---------- กติกาเกม: ฟังก์ชันบริสุทธิ์ รับสถานะ + คำสั่ง คืนสถานะใหม่ ---------- */
const MAXT = 5;
const BOARD = {
  N: 30,
  ladders: { 3: 15, 8: 20, 12: 24 },
  snakes: { 18: 6, 21: 9, 26: 14, 29: 19 },
  question: [2, 5, 10, 16, 22, 27],
  shoot: [7, 13, 25],
  swap: [11, 20],
  bite: [4, 15],
  bomb: [28],
  timerSec: 15,
  biteBack: 3,
  bombBack: 2,
  teamColors: ['#F6F5F1', '#C1331D', '#6D912E', '#F5D96B', '#5DB8F0'],
  defaultNames: ['ทีม 1', 'ทีม 2', 'ทีม 3', 'ทีม 4', 'ทีม 5'],
};

/* วงล้อลงโทษ 8 ช่อง เรียงตามเข็มนาฬิกาจากด้านบน การ์ดยิงโหดกว่าการ์ดคำถาม */
const WHEEL = {
  q: [{ t: 'back', n: 1 }, { t: 'back', n: 2 }, { t: 'safe' }, { t: 'back', n: 3 }, { t: 'stop' }, { t: 'back', n: 1 }, { t: 'swapLast' }, { t: 'back', n: 2 }],
  shoot: [{ t: 'back', n: 2 }, { t: 'back', n: 3 }, { t: 'stop' }, { t: 'back', n: 4 }, { t: 'safe' }, { t: 'back', n: 3 }, { t: 'swapLast' }, { t: 'back', n: 5 }],
};
const wheelLabel = (o) => o.t === 'back' ? 'ถอย ' + o.n : o.t === 'stop' ? 'หยุด 1 ตา' : o.t === 'safe' ? 'รอดตัว' : 'สลับกับทีมโหล่';

function squareKind(n) {
  if (n === 1) return 'start';
  if (n === BOARD.N) return 'finish';
  if (BOARD.ladders[n]) return 'ladder';
  if (BOARD.snakes[n]) return 'snake';
  if (BOARD.question.includes(n)) return 'question';
  if (BOARD.shoot.includes(n)) return 'shoot';
  if (BOARD.swap.includes(n)) return 'swap';
  if (BOARD.bite.includes(n)) return 'bite';
  if (BOARD.bomb.includes(n)) return 'bomb';
  return 'plain';
}

const zeros = () => Array(MAXT).fill(0);
function initialState() {
  return {
    v: 0,
    phase: 'setup',
    nTeams: 5,
    names: BOARD.defaultNames.slice(),
    pos: zeros(),
    stop: zeros(),
    order: [],
    turn: 0,
    dice: null,          // {value, nonce, team}
    move: null,          // {nonce, team, segs:[...]}
    fx: null,            // {nonce, list:[...]} เอฟเฟกต์ที่จอโชว์ต้องเล่นหลังเดินหมาก
    pendingCard: null,   // 'q' | 'shoot'
    prank: null,         // 'shoot' | 'swap' | 'bite' ตอนรอเลือกทีม
    target: null,
    card: null,          // {kind, idx, no, answerer, shooter, result}
    timer: { state: 'idle', remaining: BOARD.timerSec, nonce: 0 },
    next: { q: 0, shoot: 0 },
    winner: null,
    endedEarly: false,
    round: 1,
  };
}

const clone = (o) => JSON.parse(JSON.stringify(o));
const isCurrentState = (s) => !!(s && Array.isArray(s.stop) && Array.isArray(s.pos) && s.pos.length === MAXT && 'prank' in s);

function current(s) { return s.order[s.turn]; }

// แต้มเต๋ามาจากลูกเต๋ายักษ์ของจริง สตาฟเป็นคนกดแต้มที่ทอยได้
const dieValue = (v) => { v = v | 0; return v >= 1 && v <= 6 ? v : 0; };

function teamsInPlay(s) { return [...Array(s.nTeams).keys()]; }

function fxPush(s, step) {
  if (!s.fx || s.fx.nonce !== s.v) s.fx = { nonce: s.v, list: [] };
  s.fx.list.push(step);
}

// ถอยหลัง n ช่อง ไม่ต่ำกว่าช่อง 1 คืนเส้นทางที่ถอย
function pushBack(s, t, n) {
  const from = s.pos[t];
  if (from <= 1) return [];
  const to = Math.max(1, from - n);
  const path = [];
  for (let i = from - 1; i >= to; i--) path.push(i);
  s.pos[t] = to;
  return path;
}

// ใครเล่นได้ในฐานะเป้าหมายของแต่ละช่องแกล้ง
function validTargets(s, kind, me) {
  return teamsInPlay(s).filter((t) => {
    if (t === me) return false;
    if (kind === 'swap') return s.pos[t] >= 1 && s.pos[t] !== s.pos[me];
    if (kind === 'bite') return s.pos[t] > 1;
    return true;
  });
}

function advanceTurn(s) {
  if (!s.stop) s.stop = zeros();
  const len = s.order.length;
  for (let i = 0; i < len; i++) {
    s.turn = (s.turn + 1) % len;
    const t = s.order[s.turn];
    if (s.stop[t] > 0) { s.stop[t]--; fxPush(s, { k: 'skipped', team: t }); continue; }
    break;
  }
  s.phase = 'ready';
  s.card = null;
  s.pendingCard = null;
  s.prank = null;
  s.target = null;
  s.timer = { state: 'idle', remaining: BOARD.timerSec, nonce: s.v };
}

function leaderIndex(s) {
  let best = s.order[0];
  for (const t of s.order) if (s.pos[t] > s.pos[best]) best = t;
  return best;
}

// ทีมโหล่ที่ไม่ใช่ตัวเอง ถ้าเสมอกันเอาทีมที่มาก่อนในลำดับเล่น
function lastPlace(s, me) {
  let w = null;
  for (const t of s.order) if (t !== me && (w === null || s.pos[t] < s.pos[w])) w = t;
  return w;
}

/**
 * apply(state, action, rng, now) => new state
 * action.type: setup | startPlay | roll | pickTarget | openCard |
 *   timerStart | timerPause | timerResume | timerReset | judge | closeCard | spin |
 *   skip | moveTo | endNow | newRound | reset
 */
function apply(prev, action, rng = Math.random) {
  const s = clone(prev);
  s.v = prev.v + 1;
  const nonce = s.v;
  if (!s.stop) s.stop = zeros();
  switch (action.type) {
    case 'setup': {
      const n = Math.min(MAXT, Math.max(2, action.nTeams | 0));
      s.nTeams = n;
      s.names = BOARD.defaultNames.map((d, i) => {
        const t = (action.names && action.names[i] || '').trim().slice(0, 24);
        return t || d;
      });
      // ลำดับที่สตาฟเรียงเอง ทีมที่ไม่ได้เลือกต่อท้ายตามเลขทีม
      const picked = (action.order || []).filter((t, i, a) => Number.isInteger(t) && t >= 0 && t < n && a.indexOf(t) === i);
      s.order = picked.concat(teamsInPlay(s).filter((t) => !picked.includes(t)));
      s.pos = zeros(); s.stop = zeros();
      s.turn = 0;
      s.dice = null; s.move = null; s.fx = null; s.card = null; s.pendingCard = null; s.prank = null; s.target = null;
      s.winner = null; s.endedEarly = false;

/* เส้นทางงู: เดินตามเส้นแบ่งช่องเพื่อไม่ทับช่องคำถามและช่องยิง */
const SNAKE_ROUTES = {
  18: { amp: 8, pts: [[1010, 515], [962, 575], [948, 640], [948, 800], [962, 855], [1004, 900]] },
  21: { amp: 8, pts: [[650, 335], [602, 395], [588, 460], [588, 640], [602, 695], [646, 742]] },
  26: { amp: 30, pts: [[336, 160], [308, 570]] },
  29: { amp: 30, pts: [[876, 160], [1028, 390]] },

function snakePoints(head) {
  const R = SNAKE_ROUTES[head];
  const segs = [];
  let total = 0;
  for (let i = 1; i < R.pts.length; i++) {
    const [x1, y1] = R.pts[i - 1], [x2, y2] = R.pts[i];
    const L = Math.hypot(x2 - x1, y2 - y1);

  for (let i = 0; i <= N; i++) {
    const d = (i / N) * total, t = i / N;
    const g = segs.find((q) => d <= q.s0 + q.L + 0.001) || segs[segs.length - 1];
    const u = Math.min(1, (d - g.s0) / g.L);
    const nx = -(g.y2 - g.y1) / g.L, ny = (g.x2 - g.x1) / g.L;

        if (e.key === 'bandai-oph2026-cping' && e.newValue && !e.newValue.startsWith(this.myId)) this.otherCtlSeen = Date.now();

  screenAck(v) {

  },
  async write(doc) {
    if (this.mode === 'firebase') {
      if (!this.fbConnected) throw new Error('offline');
      await Promise.race([this.ref.set({ json: JSON.stringify(doc), v: doc.state.v }), sleep(8000).then(() => { throw new Error('timeout'); })]);
    } else if (this.mode === 'online') {
      if (!this.netOk()) throw new Error('offline');
      await Promise.race([this.ref.set(doc), sleep(8000).then(() => { throw new Error('timeout'); })]);
      if (this.room) {
        try {
          const bytes = new TextEncoder().encode(JSON.stringify(doc.state)).length;
          if (bytes < 3900) this.room.emit('s', doc.state).catch(() => {});
        } catch (e) {}
      }
    } else {
      store.set(KEY_DOC, JSON.stringify(doc));
      if (this.bc) this.bc.postMessage({ t: 'doc', doc });
    }
  },
};

  receive(doc) {
    if (!doc || !doc.state) { if (!this.shown) this.renderAll(null); return; }
    const st = doc.state;
    if (!isCurrentState(st)) return; // รอจอควบคุมแปลงข้อมูลเก่าให้ก่อน
    if (this.latest && st.v <= this.latest.v && !(st.v < this.latest.v - 50)) return; // ข้อมูลเก่า

  async process() {

      this.shown = next;
      Sync.screenAck(next.v);
    }
    this.busy = false;
  },
  async transition(prev, next) {
    if (!prev) {
      this.seenDice = next.dice ? next.dice.nonce : 0;
      this.seenMove = next.move ? next.move.nonce : 0;
      this.seenFx = next.fx ? next.fx.nonce : 0;
      this.renderAll(next);
      return;
    }
    const c0 = Sound.count;
    const diceNew = next.dice && next.dice.nonce > this.seenDice;
    const moveNew = next.move && next.move.nonce > this.seenMove;
    const fxNew = next.fx && next.fx.nonce > this.seenFx;
    // ปิดหน้าซ้อนที่จะหายไปก่อน
    const cardOn = (s) => s && (s.phase === 'card' || s.phase === 'judged');
    if (cardOn(prev) && !cardOn(next)) { Sound.close(); this.el.card.classList.remove('on'); await sleep(420 * T); }
    if (prev.phase === 'won' && next.phase !== 'won') this.el.win.classList.remove('on');
    if (prev.phase === 'setup' && next.phase !== 'setup') this.el.splash.classList.remove('on');
    if (prev.phase !== 'order' && next.phase === 'order') Sound.start();
    if (prev.phase === 'order' && next.phase === 'ready') Sound.go();
    if (next.phase === 'setup' && prev.phase !== 'setup') Sound.start();
    if (prev.phase === 'pickTarget' && next.phase === 'cardPending') Sound.lock();
    if (cardOn(prev) && next.phase === 'card' && prev.timer && next.timer && prev.timer.nonce !== next.timer.nonce) {
      if (next.timer.state === 'running') Sound.whistle();
      else if (next.timer.state === 'paused') Sound.pause();
    }
    // ตำแหน่งระหว่างเล่นแอนิเมชัน เริ่มจากของเดิมแล้วขยับตามทีละขั้น
    const work = clone(prev);
    if (diceNew) {
      this.seenDice = next.dice.nonce;
      this.renderPanel(prev, next.dice.team);
      await this.rollDice(next.dice.value, next.names[next.dice.team]);
    }
    if (moveNew) {
      this.seenMove = next.move.nonce;
      await this.animateMove(prev, next);
      const mv = next.move, last = mv.segs[mv.segs.length - 1];
      work.pos[mv.team] = last.to != null ? last.to : last.path[last.path.length - 1];
    }
    if (fxNew) {
      this.seenFx = next.fx.nonce;
      for (const f of next.fx.list) { try { await this.playFx(f, work, next); } catch (e) { console.error(e); } }
    }
    this.renderAll(next);
    if (Sound.count === c0) Sound.blip(); // ทุกการกดต้องมีเสียงเสมอ
  },
  async rollDice(v, name) {

  toast(text, kind = '', ms = 1100) {

    clearTimeout(this._tt); this._tt = setTimeout(() => t.classList.remove('show'), ms * T);
  },
  pieceAt(t, x, y, sc = 1) { const p = $('#pc' + t); p.style.transform = `translate(${x}px, ${y}px)` + (sc !== 1 ? ` scale(${sc})` : ''); this.piecePos[t] = { x, y }; },
  slot(st, t) {
    // จัดหมากหลายตัวในช่องเดียวกันไม่ให้ทับกัน
    const p = st.pos[t];
    if (p === 0) {
      // หมากที่ยังไม่ออกเดิน ย่อเล็กเรียงแถวบนช่อง 1
      const wait = [...Array(st.nTeams).keys()].filter((u) => st.pos[u] === 0);
      const c1 = sqXY(1), k = wait.indexOf(t);
      return { x: c1.x - 68 + k * 34, y: c1.y - 6, sc: 0.6 };
    }
    const here = [...Array(st.nTeams).keys()].filter((u) => st.pos[u] === p);
    const i = here.indexOf(t), n = here.length;
    const c = sqXY(p);
    const offs = n === 1 ? [[0, 6]] : n === 2 ? [[-36, 6], [36, 6]] : n === 3 ? [[-40, -18], [40, -18], [0, 50]] : n === 4 ? [[-38, -22], [38, -22], [-38, 50], [38, 50]] : [[-46, -26], [46, -26], [0, 14], [-46, 54], [46, 54]];
    const o = offs[Math.max(0, i)] || [0, 0];
    return { x: c.x + o[0], y: c.y + o[1] };
  },
  layoutPieces(st) {
    for (let t = 0; t < MAXT; t++) {
      const el = $('#pc' + t);
      const on = st && t < st.nTeams && st.phase !== 'setup';
      el.hidden = !on;
      el.classList.toggle('frozen', !!(on && st.stop && st.stop[t] > 0));
      if (on) { const p = this.slot(st, t); this.pieceAt(t, p.x, p.y, p.sc || 1); }
    }
  },
  async hopTo(el, from, to) {
    const mid = { x: (from.x + to.x) / 2, y: Math.min(from.y, to.y) - 40 };
    const a = el.animate([
      { transform: `translate(${from.x}px, ${from.y}px)` },
      { transform: `translate(${mid.x}px, ${mid.y}px)` },
      { transform: `translate(${to.x}px, ${to.y}px)` },
    ], { duration: ANIM.step * T, easing: 'steps(6, end)' });
    await a.finished.catch(() => {});
    el.style.transform = `translate(${to.x}px, ${to.y}px)`;
  },
  async glide(el, pts, ms) {
    const frames = pts.map((p) => ({ transform: `translate(${p.x}px, ${p.y}px)` }));
    const a = el.animate(frames, { duration: ms * T, easing: 'linear' });
    await a.finished.catch(() => {});

  async animateMove(prev, next) {

    for (const g of mv.segs) {
      if (g.type === 'walk' || g.type === 'back') {
        if (g.type === 'back') this.toast(`${next.names[t]} ถอย ${g.path.length} ช่อง`, 'bad', 900);
        for (const n of g.path) { const to = ctr(n); await this.hopTo(el, cur, to); cur = to; Sound.step(); }

        const pts = snakePoints(g.from).filter((_, i) => i % 3 === 0).map((p) => ({ x: p.x, y: p.y }));
        await this.glide(el, [cur, ...pts, ctr(g.to)], ANIM.special);

    el.classList.remove('moving');
    const first = mv.segs[0];
    if (first && first.type === 'walk') {
      const last = mv.segs[mv.segs.length - 1], land = last.to != null ? last.to : last.path[last.path.length - 1], k = squareKind(land);
      if (next.phase === 'won') { /* หน้าชนะจะขึ้นเอง */ }
      else if (k === 'question') { this.toast(`ช่องคำถาม ${next.names[t]} ตอบเอง`, '', 1300); Sound.card(); }
      else if (k === 'shoot') { this.toast(`ช่องยิง ${next.names[t]} เลือกทีมที่จะยิง`, '', 1300); Sound.alarm(); }
      else if (k === 'swap') { this.toast(`ช่องสลับที่ ${next.names[t]} เลือกทีมที่จะสลับ`, '', 1300); Sound.alarm(); }
      else if (k === 'bite') { this.toast(`ช่องส่งงูกัด ${next.names[t]} เลือกเหยื่อ`, 'bad', 1300); Sound.hiss(); }
      else if (k === 'bomb') { this.toast(`ระเบิด! ทีมอื่นถอย ${BOARD.bombBack}`, 'bad', 1300); Sound.fuse(); }
      else if (last.type === 'walk') this.toast(`${next.names[t]} ถึงช่อง ${land}`, '', 1100);
      await sleep(ANIM.land * T);
    }
    await sleep(ANIM.pause * T);
  },
  /* ---------- เอฟเฟกต์แกล้งกัน วงล้อ และการโดนถอยหลัง ---------- */
  ctrOf(st, t) { const p = this.slot(st, t); return { x: p.x, y: p.y }; },
  pieceEl(t) { return $('#pc' + t); },
  flashScreen(kind = 'red') { const f = this.el.flash; f.className = 'flash ' + kind; void f.offsetWidth; f.classList.add('on'); },
  quake() { ['#board-svg', '#pieces'].forEach((q) => { const e = $(q); e.classList.remove('quake'); void e.offsetWidth; e.classList.add('quake'); }); },
  floatText(x, y, text, cls = '') {
    const d = document.createElement('div'); d.className = 'floattxt ' + cls; d.textContent = text;

  },
  async hurtBack(t, path, work, opts = {}) {
    const el = this.pieceEl(t); if (!el || !path || !path.length) return;
    el.hidden = false; el.classList.add('moving');

    if (!opts.quiet) { Sound.hurt(); this.flashScreen('red'); }
    el.classList.add('hurt');
    this.floatText(cur.x, cur.y - 110, '-' + path.length, 'bad');
    await sleep(ANIM.hurt * T);
    el.classList.add('reverse');
    for (const n of path) {
      const c = sqXY(n), to = { x: c.x, y: c.y + 6 };
      await this.hopTo(el, cur, to); cur = to;
      if (!opts.quiet) Sound.stepBack();

  async swapPieces(a, b, work) {

    const pa = work.pos[a]; work.pos[a] = work.pos[b]; work.pos[b] = pa;
    const ta = this.ctrOf(work, a), tb = this.ctrOf(work, b);
    Sound.swap();
    const arc = (el, f, t, up) => el.animate([
      { transform: `translate(${f.x}px, ${f.y}px)` },
      { transform: `translate(${(f.x + t.x) / 2 + (up ? -40 : 40)}px, ${Math.min(f.y, t.y) - (up ? 160 : 60)}px) scale(1.25)` },
      { transform: `translate(${t.x}px, ${t.y}px)` },
    ], { duration: ANIM.swap * T, easing: 'steps(14, end)' }).finished.catch(() => {});
    [ea, eb].forEach((e) => { e.classList.add('moving', 'glow'); });
    await Promise.all([arc(ea, fa, ta, true), arc(eb, fb, tb, false)]);
    ea.style.transform = `translate(${ta.x}px, ${ta.y}px)`; eb.style.transform = `translate(${tb.x}px, ${tb.y}px)`;
    this.piecePos[a] = ta; this.piecePos[b] = tb;
    [ea, eb].forEach((e) => { e.classList.remove('moving', 'glow'); });

        <rect x="-22" y="4" width="44" height="10" fill="#F6F5F1"/><rect x="-14" y="18" width="28" height="12" fill="#F6F5F1"/><rect x="-6" y="34" width="12" height="12" fill="#F6F5F1"/></g>

  async spinWheel(f, next) {

  renderCard(st) {

        <div class="card-body"><div><p class="card-q">${esc(q.q)}</p><div class="card-rule">ตอบผิด ${shoot ? 'ทีมที่ถูกยิง' : ''}หมุนวงล้อลงโทษ</div></div>
          <div class="timer" id="timer"><svg viewBox="0 0 190 190" shape-rendering="crispEdges" id="timer-ring"></svg><div class="num" id="timer-num">${BOARD.timerSec}</div></div></div>

  paintTimer(st) {
    const box = $('#timer'); if (!box) return;
    const rem = timerNow(st, this.clk);
    const tm = st.timer;
    const sec = Math.ceil(rem - 0.001);
    const N = BOARD.timerSec;
    const lit = tm.state === 'idle' ? N : Math.max(0, Math.min(N, Math.ceil(rem - 0.001)));
    const ring = $('#timer-ring');
    if (ring && ring.dataset.lit !== String(lit)) {
      ring.dataset.lit = lit;
      let s = '';
      for (let i = 0; i < N; i++) {
        const a = (i / N) * Math.PI * 2 - Math.PI / 2;
        const x = 95 + Math.cos(a) * 78, y = 95 + Math.sin(a) * 78;

    const bits = Array.from({ length: REDUCED ? 40 : 180 }, () => ({ x: Math.random() * 1920, y: -Math.random() * 1080, s: 10 + Math.floor(Math.random() * 3) * 6, v: 3 + Math.random() * 5, c: cols[Math.floor(Math.random() * cols.length)], w: Math.random() * 6 }));
    const t0 = performance.now();
    const frame = (now) => {
      g.clearRect(0, 0, 1920, 1080);
      for (const b of bits) { b.y += b.v; b.x += Math.sin((now - t0) / 300 + b.w) * 1.5; if (b.y > 1090) { b.y = -20; } g.fillStyle = b.c; g.fillRect(Math.round(b.x / 6) * 6, Math.round(b.y / 6) * 6, b.s, b.s); }
      if (this.el.win.classList.contains('on') && now - t0 < 12000) requestAnimationFrame(frame); else g.clearRect(0, 0, 1920, 1080);

/* ================= จอควบคุม ================= */
const Control = {
  hideAns: store.get('bandai-hide-ans') === '1',
  doc: null, pending: false, lockUntil: 0, err: '', renderedKey: null, setupN: null, setupNames: null, setupOrder: [], armed: {}, clk: makeClock(), lastWrite: 0,
  mount() {
    this.mountedAt = Date.now();
    document.getElementById('app').innerHTML = `<div class="ctl" id="ctl">
      <div class="ctl-top"><h1>บันไดธุรกิจ <span>จอควบคุม</span></h1><span class="pill" id="pill-net"><i></i><span></span></span><span class="pill" id="pill-screen"><i></i><span></span></span><span class="pill" id="pill-time" hidden></span>${Sync.roomCode && !Sync.fixedRoom ? `<span class="pill">ห้อง ${esc(Sync.roomCode)}</span>` : ''}</div>
      <div class="chips" id="chips"></div>
      <div id="errbox"></div>
      <div class="main" id="main"></div>
      <div class="help" id="help"></div>
    </div>`;
    document.addEventListener('click', (e) => this.onClick(e));
    document.addEventListener('input', (e) => { const m = /^team-name-(\d)$/.exec(e.target.id || ''); if (m) { if (!this.setupNames) this.setupNames = this.st ? this.st.names.slice() : BOARD.defaultNames.slice(); this.setupNames[+m[1]] = e.target.value; this.paintOrderPick(); } });
    document.addEventListener('keydown', (e) => this.onKey(e));
    Sync.onChange(() => { this.paintTop(); this.paintMainBtn(); this.renderErr(); });
    this.render();
    const loop = () => { this.paintTimer(); this.paintMainBtn(); this.paintElapsed(); requestAnimationFrame(loop); };
    requestAnimationFrame(loop);
  },
  get st() { return this.doc && this.doc.state; },
  receive(doc, src) {
    if (!doc) {
      if (!this.doc && !this.pending) this.commit({ state: initialState(), hist: [] }, true);
      return;
    }
    if (!doc.state) return;
    const incoming = JSON.parse(JSON.stringify(doc));
    // ข้อมูลจากเกมเวอร์ชันเก่า (4 ทีม ทอยหาลำดับ) ใช้ต่อไม่ได้ เริ่มหน้าเตรียมเกมใหม่ เก็บชื่อทีมไว้
    if (!isCurrentState(incoming.state)) {
      if (this.pending) return;
      const fresh = initialState();
      fresh.v = (incoming.state.v || 0) + 1;
      (incoming.state.names || []).forEach((n, i) => { if (i < MAXT && n) fresh.names[i] = n; });
      this.commit({ state: fresh, hist: [] }, true);
      return;
    }
    if (!incoming.hist) incoming.hist = this.doc ? this.doc.hist : [];
    if (this.doc && incoming.state.v < this.doc.state.v && !this.pending) {
      // ข้อมูลเก่ากว่า ไม่ต้องใช้ เว้นแต่ห่างกันมากผิดปกติ
      if (this.doc.state.v - incoming.state.v < 50) return;
    }
    if (this.pending) return;
    this.doc = incoming;
    this.render();
  },
  async commit(doc, silent = false) {
    this.pending = true; this.err = ''; this.renderErr(); this.paintMainBtn();
    try {
      await Sync.write(doc);
      this.doc = doc;
      this.lastWrite = Date.now();
    } catch (e) {
      if (!silent) this.err = Sync.netOk() ? 'ส่งไม่สำเร็จ กดอีกครั้ง' : 'เน็ตหลุด ส่งคำสั่งไม่ได้ รอเน็ตกลับมาแล้วกดอีกครั้ง';
    }
    this.pending = false;
    this.render();
  },
  dispatch(action, { main = false } = {}) {
    const s = this.st; if (!s || this.pending) return;
    if (main && Date.now() < this.lockUntil) return;
    action.now = Date.now();
    if (action.type === 'timerPause' || action.type === 'judge') action.remaining = Math.round(timerNow(s, this.clk) * 10) / 10;
    const next = apply(s, action);
    if (next === s) return;
    const hist = [s, ...(this.doc.hist || [])].slice(0, 20);
    this.lockUntil = Date.now() + animDuration(s, next);
    this.commit({ state: next, hist });
  },
  undo() {
    const d = this.doc; if (!d || !d.hist || !d.hist.length || this.pending) return;
    const restored = JSON.parse(JSON.stringify(d.hist[0]));
    restored.v = d.state.v + 1;
    this.lockUntil = 0;
    this.commit({ state: restored, hist: d.hist.slice(1) });
  },
  mainAction() {
    const s = this.st;
    if (!s) return { label: 'กำลังเชื่อมต่อ', act: null };
    const cur = s.order && s.order.length ? s.order[s.turn] : null;
    switch (s.phase) {
      case 'setup': return { label: 'เริ่มเกม', act: 'start' };
      case 'order': return { label: 'เริ่มเล่น', act: 'startPlay' };
      case 'ready': return { label: 'กดแต้มที่ทอยได้ด้านบน', act: null };
      case 'cardPending': return { label: s.pendingCard === 'shoot' ? 'เปิดการ์ดยิง' : 'เปิดการ์ดคำถาม', act: 'openCard' };
      case 'pickTarget': return { label: s.prank === 'swap' ? 'เลือกทีมที่จะสลับด้านบน' : s.prank === 'bite' ? 'เลือกเหยื่อด้านบน' : 'เลือกทีมที่จะยิงด้านบน', act: null };
      case 'card': {
        const rem = timerNow(s, this.clk);
        if (s.timer.state === 'idle') return { label: `เริ่มจับเวลา ${BOARD.timerSec} วินาที`, act: 'timerStart' };
        if (s.timer.state === 'running' && rem > 0) return { label: 'หยุดเวลา', act: 'timerPause' };
        if (s.timer.state === 'paused') return { label: 'เดินเวลาต่อ', act: 'timerResume' };
        return { label: 'หมดเวลา กดเพื่อจับเวลาใหม่', act: 'timerStart' };
      }
      case 'judged': return s.card.result === 'wrong' ? { label: 'หมุนวงล้อลงโทษ', act: 'spin' } : { label: 'ปิดการ์ด ไปตาถัดไป', act: 'closeCard' };
      case 'won': return { label: 'เล่นรอบใหม่ ชื่อทีมเดิม', act: 'newRound' };
    }
    return { label: '', act: null };
  },
  runMain() {
    const m = this.mainAction();
    if (!m.act) return;
    if (m.act === 'start') {
      const n = this.setupN || this.st.nTeams;
      const names = [...Array(MAXT).keys()].map((i) => { const el = document.getElementById('team-name-' + i); return el ? el.value : ''; });
      this.dispatch({ type: 'setup', nTeams: n, names, order: this.setupOrder.filter((t) => t < n) }, { main: true });
      this.setupNames = null;
    } else this.dispatch({ type: m.act }, { main: true });
  },
  onClick(e) {
    const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
    const act = b.dataset.act, s = this.st;
    switch (act) {
      case 'main': this.runMain(); break;
      case 'n': this.setupN = +b.dataset.n; this.setupOrder = this.setupOrder.filter((t) => t < this.setupN); this.renderedKey = null; this.render(); break;
      case 'ord': { const t = +b.dataset.t; const i = this.setupOrder.indexOf(t); if (i >= 0) this.setupOrder.splice(i, 1); else this.setupOrder.push(t); this.paintOrderPick(); break; }
      case 'ordClear': this.setupOrder = []; this.paintOrderPick(); break;
      case 'die': this.enterDie(+b.dataset.v); break;
      case 'target': this.dispatch({ type: 'pickTarget', team: +b.dataset.t }, { main: true }); break;
      case 'right': this.dispatch({ type: 'judge', correct: true }); break;
      case 'wrong': this.dispatch({ type: 'judge', correct: false }); break;
      case 'timerReset': this.dispatch({ type: 'timerReset' }); break;
      case 'undo': this.undo(); break;
      case 'skip': this.dispatch({ type: 'skip' }); break;
      case 'move': {
        const t = +$('#mv-team').value, q = parseInt($('#mv-sq').value, 10);
        if (Number.isNaN(q) || q < 0 || q > 30) { this.err = 'ใส่เลขช่อง 0 ถึง 30 (0 คือยังไม่ขึ้นกระดาน)'; this.renderErr(); break; }
        this.dispatch({ type: 'moveTo', team: t, square: q }); break;
      }
      case 'endNow': case 'reset': {
        if (this.armed[act] && Date.now() - this.armed[act] < 4000) { this.armed[act] = 0; this.dispatch({ type: act }); }
        else { this.armed[act] = Date.now(); this.renderHelp(); setTimeout(() => this.renderHelp(), 4100); }
        break;
      }
      case 'rename': this.dispatch({ type: 'reset' }); break;
      case 'role': switchRole(); break;
      case 'toggleAns': this.hideAns = !this.hideAns; store.set('bandai-hide-ans', this.hideAns ? '1' : '0'); this.renderedKey = null; this.render(); break;
    }
  },
  enterDie(v) {
    const s = this.st; if (!s) return;
    if (s.phase === 'ready') this.dispatch({ type: 'roll', value: v }, { main: true });
  },
  // ปุ่มเรียงลำดับทีมในหน้าเตรียมเกม กดตามลำดับที่จะเล่น กดซ้ำเพื่อเอาออก
  paintOrderPick() {
    const box = $('#ordpick'); if (!box) return;
    const s = this.st; const n = this.setupN || (s ? s.nTeams : 5);
    const nm = (i) => { const v = this.setupNames ? this.setupNames[i] : (s && s.names[i] !== BOARD.defaultNames[i] ? s.names[i] : ''); return esc((v || '').trim() || BOARD.defaultNames[i]); };
    const order = this.setupOrder.filter((t) => t < n);
    const rest = [...Array(n).keys()].filter((t) => !order.includes(t));
    box.innerHTML = `<div class="ordbtns">${[...Array(n).keys()].map((t) => { const k = order.indexOf(t); return `<button type="button" class="ordbtn ${k >= 0 ? 'on' : ''}" data-act="ord" data-t="${t}"><span class="sw" style="background:${COLORS[t]}"></span>${nm(t)}${k >= 0 ? `<b>${k + 1}</b>` : ''}</button>`; }).join('')}</div>
      <p class="hint">ลำดับที่จะเล่น: ${order.concat(rest).map((t, i) => `${i + 1}. ${nm(t)}`).join(' · ')}${order.length ? ' <button class="sbtn" type="button" data-act="ordClear">ล้างลำดับ</button>' : ''}</p>`;
  },
  diePad() {
    const locked = Date.now() < this.lockUntil || this.pending;
    return `<div class="diepad">${[1, 2, 3, 4, 5, 6].map((v) => `<button type="button" class="die" data-act="die" data-v="${v}" ${locked ? 'disabled' : ''} aria-label="ทอยได้ ${v}">${diceSVG(v)}<span>${v}</span></button>`).join('')}</div>
      <p class="hint">ตัวแทนทีมทอยเต๋ายักษ์ แล้วกดแต้มที่ได้ หรือกดแป้นเลข 1 ถึง 6 ถ้ากดผิด ใช้ปุ่มย้อนกลับ 1 ขั้นด้านล่าง</p>`;
  },
  onKey(e) {
    const tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
    const s = this.st; if (!s) return;
    if (e.code === 'Space') { e.preventDefault(); if (!e.repeat) this.runMain(); }
    else if (/^(Digit|Numpad)[1-6]$/.test(e.code) && s.phase === 'ready') {
      if (!e.repeat) this.enterDie(+e.code.slice(-1));
    }
    else if (s.phase === 'card' && e.code === 'KeyY') this.dispatch({ type: 'judge', correct: true });
    else if (s.phase === 'card' && e.code === 'KeyN') this.dispatch({ type: 'judge', correct: false });
    else if (s.phase === 'pickTarget' && /^Digit[1-5]$/.test(e.code)) this.dispatch({ type: 'pickTarget', team: +e.code.slice(5) - 1 }, { main: true });
  },
  paintTop() {
    const pn = $('#pill-net'), ps = $('#pill-screen'); if (!pn) return;
    const ok = Sync.netOk();
    pn.className = 'pill ' + (ok ? 'ok' : 'bad');
    pn.lastElementChild.textContent = Sync.mode === 'offline' ? 'โหมดออฟไลน์ เครื่องเดียว' : (ok ? 'ออนไลน์' : 'เน็ตหลุด');
    const so = Sync.screenOnline();
    const early = Date.now() - (this.mountedAt || 0) < 5000;
    ps.className = 'pill ' + (so === true ? 'ok' : so === false && !early ? 'bad' : '');
    ps.lastElementChild.textContent = so === true ? 'จอโชว์เชื่อมต่ออยู่' : so === false ? (early ? 'กำลังหาจอโชว์' : 'ยังไม่เห็นจอโชว์') : 'ไม่ทราบสถานะจอโชว์';
  },
  paintMainBtn() {
    const lockedNow = Date.now() < this.lockUntil || this.pending || !Sync.netOk();
    document.querySelectorAll('.die').forEach((d) => { if (d.disabled !== lockedNow) d.disabled = lockedNow; });
    document.querySelectorAll('.targets .btn').forEach((d) => { const v = lockedNow || d.dataset.ok !== '1'; if (d.disabled !== v) d.disabled = v; });
    const btn = $('#mainbtn'); if (!btn) return;
    const m = this.mainAction();
    const locked = Date.now() < this.lockUntil;
    const net = Sync.netOk();
    const dis = !m.act || this.pending || locked || !net;
    if (btn.disabled !== dis) btn.disabled = dis;
    const label = this.pending ? 'กำลังส่ง' : !net ? 'เน็ตหลุด รอสักครู่' : m.label;
    const lab = btn.querySelector('.lab');
    if (lab.textContent !== label) lab.textContent = label;
    const bar = btn.querySelector('.bar');
    if (locked) { const total = Math.max(1, this.lockUntil - (this._lockStart || Date.now())); bar.style.width = Math.min(100, 100 * (1 - (this.lockUntil - Date.now()) / total)) + '%'; }

  },
  paintTimer() {
    const el = $('#ctl-timer'); const s = this.st; if (!el || !s || s.phase !== 'card') return;

    const out = s.timer.state === 'running' && rem <= 0;
    const txt = s.timer.state === 'idle' ? String(BOARD.timerSec) : out ? '0' : String(Math.ceil(rem - 0.001));
    if (el.textContent !== txt) el.textContent = txt;
    el.classList.toggle('warn', out || (s.timer.state === 'running' && rem <= 5));
  },
  paintElapsed() {
    const el = $('#pill-time'), s = this.st; if (!el) return;

    const ms = Math.max(0, (s.endedAt || Date.now()) - s.playStartedAt);
    const m = Math.floor(ms / 60000), sec = Math.floor((ms % 60000) / 1000);

  renderErr() {

    const tn = (t) => `<span class="tn">${nameOf(s, t)}</span>`;

          <div class="form"><div><label>จำนวนทีมรอบนี้</label><div class="seg">${[2, 3, 4, 5].map((k) => `<button type="button" data-act="n" data-n="${k}" class="${k === n ? 'on' : ''}">${k} ทีม</button>`).join('')}</div></div>

          <p class="hint">เว้นว่างไว้ได้ ระบบจะใช้ชื่อ ทีม 1 ถึง ทีม ${n}</p>
          <div><label>ลำดับการเล่น กดชื่อทีมตามลำดับที่จะเล่น ถ้าไม่กด ระบบเรียงตามเลขทีม</label><div id="ordpick"></div></div></div>${btn}`;

          <p class="hint">การ์ดใบถัดไปคือ ${s.pendingCard === 'shoot' ? 'การ์ดยิง' : 'การ์ดคำถาม'} ข้อ ${(s.next[s.pendingCard] % CARDS[s.pendingCard].length) + 1}</p>${btn}`;

  // สรุปสิ่งที่เพิ่งเกิด ให้สตาฟรู้ว่าจอโชว์กำลังเล่นอะไร
  lastNote(s) {

  },
  renderHelp() {
    const s = this.st, box = $('#help'); if (!box) return;
    const playing = s && ['ready', 'cardPending', 'pickTarget', 'card', 'judged'].includes(s.phase);
    const canUndo = this.doc && this.doc.hist && this.doc.hist.length;
    const armed = (k) => this.armed[k] && Date.now() - this.armed[k] < 4000;
    const teams = s ? [...Array(s.nTeams).keys()] : [];
    box.innerHTML = `<h2>ปุ่มช่วยแก้ปัญหา</h2>
      <div class="help-row">
        <button class="sbtn" type="button" data-act="undo" ${canUndo && !this.pending ? '' : 'disabled'}>ย้อนกลับ 1 ขั้น</button>
        <button class="sbtn" type="button" data-act="skip" ${playing ? '' : 'disabled'}>ข้ามตานี้</button>
        <button class="sbtn ${armed('endNow') ? 'arm' : ''}" type="button" data-act="endNow" ${playing ? '' : 'disabled'}>${armed('endNow') ? 'กดอีกครั้งเพื่อจบเกม' : 'จบเกมตอนนี้ ทีมนำชนะ'}</button>
        <button class="sbtn ${armed('reset') ? 'arm' : ''}" type="button" data-act="reset" ${s && s.phase !== 'setup' ? '' : 'disabled'}>${armed('reset') ? 'กดอีกครั้งเพื่อเริ่มใหม่' : 'เริ่มเกมใหม่'}</button>
      </div>
      <div class="help-row">
        <label for="mv-team" style="font-size:15px;color:var(--cream)">ย้ายหมาก</label>
        <select id="mv-team" ${s && s.phase !== 'setup' ? '' : 'disabled'}>${teams.map((t) => `<option value="${t}">${nameOf(s, t)}</option>`).join('')}</select>
        <input id="mv-sq" type="number" min="0" max="30" inputmode="numeric" placeholder="ช่อง" style="width:90px" ${s && s.phase !== 'setup' ? '' : 'disabled'}>
        <button class="sbtn" type="button" data-act="move" ${s && s.phase !== 'setup' ? '' : 'disabled'}>ย้าย</button>
      </div>
      <div class="help-row"><button class="sbtn" type="button" data-act="role">กลับหน้าเลือกบทบาท</button></div>`;
  },
};

/* ================= เริ่มต้น ================= */
function switchRole() {
  store.del('bandai-role', 'session');
  try { if (location.hash) history.replaceState(null, '', location.pathname + location.search); } catch (e) {}
  try { location.reload(); } catch (e) {}
  setTimeout(() => chooser(), 600);
}

const ROOM_CHARS = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
const cleanRoom = (t) => String(t || '').toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
function newRoomCode() { let c = ''; for (let i = 0; i < 5; i++) c += ROOM_CHARS[Math.floor(Math.random() * ROOM_CHARS.length)]; return c; }

const FIXED_ROOM = () => cleanRoom(window.GAME_ROOM);
function chooser() {
  const fbBuild = 'FIREBASE_CONFIG' in window && !FIXED_ROOM();
  const urlRoom = cleanRoom(new URLSearchParams(location.search).get('room'));
  const saved = urlRoom || cleanRoom(store.get('bandai-room'));
  document.getElementById('app').innerHTML = `<div class="chooser"><div class="chooser-inner">
    <div class="eyebrow">SWU OPEN HOUSE 2026 · SE · IMPACT DISTRICT</div>
    <h1>บันไดธุรกิจ<span>พิชิตสังคม</span></h1>
    ${fbBuild ? `<div class="roomrow"><label for="room-code">รหัสห้อง ใช้รหัสเดียวกันทั้งสองเครื่อง</label>
      <div class="help-row"><input id="room-code" maxlength="8" autocomplete="off" autocapitalize="characters" spellcheck="false" value="${esc(saved)}" placeholder="เช่น K7PQ2"><button class="sbtn" type="button" id="btn-newroom">สร้างรหัสใหม่</button></div></div>` : ''}
    <div class="roles">
      <button class="role" type="button" data-role="control"><span class="px">CONTROL</span><b>จอควบคุม</b><small>เครื่องของสตาฟ ทอยเต๋า เปิดการ์ด จับเวลา และตัดสินคำตอบ</small></button>
      <button class="role" type="button" data-role="screen"><span class="px">SCREEN</span><b>จอโชว์</b><small>เครื่องที่ต่อโปรเจกเตอร์ โชว์กระดาน การ์ด และเวลา ไม่ต้องกดอะไร</small></button>
    </div>
    <div class="mode-note" id="mode-note">กำลังตรวจการเชื่อมต่อ</div>
  </div></div>`;
  if (fbBuild) {
    $('#btn-newroom').onclick = () => { $('#room-code').value = newRoomCode(); paint(); };
    $('#room-code').addEventListener('input', (e) => { const v = cleanRoom(e.target.value); if (e.target.value !== v) e.target.value = v; paint(); });
  }
  const paint = () => {
    const n = $('#mode-note'); if (!n) return;
    const code = fbBuild ? cleanRoom(($('#room-code') || {}).value) : '';
    const needCode = fbBuild && Sync.mode === 'firebase' && code.length < 4;
    const blocked = Sync.mode === 'blocked' || Sync.mode === 'connecting' || Sync.mode === 'noconfig' || needCode;
    document.querySelectorAll('[data-role]').forEach((b) => { b.disabled = blocked; b.style.opacity = blocked ? '.4' : ''; });
    const single = () => { store.set('bandai-force-offline', '1', 'session'); Sync.goOffline(); Sync.emit(); };
    if (Sync.mode === 'noconfig') {
      n.className = 'mode-note blocked';
      n.innerHTML = `<b>ยังไม่ได้ใส่ค่าตั้งค่า Firebase</b> เปิดไฟล์ config.js แล้ววางค่าจาก Firebase ตามไฟล์วิธีตั้งค่า ระหว่างนี้ใช้เครื่องเดียวเปิดสองหน้าต่างไปก่อนได้
        <div class="help-row"><button class="sbtn" type="button" id="btn-single">ใช้เครื่องเดียวเปิดสองหน้าต่าง</button></div>`;
      $('#btn-single').onclick = single;
      return;
    }
    if (Sync.mode === 'blocked') {
      n.className = 'mode-note blocked';
      n.innerHTML = `<b>เครื่องนี้ยังเชื่อมระบบเกมไม่ได้</b> ถ้าใช้ต่อแบบนี้ จอนี้จะไม่คุยกับอีกเครื่อง ให้ตรวจ 2 อย่าง
        <ol><li>เบราว์เซอร์นี้ล็อกอิน claude.ai ด้วยบัญชีเดียวกับอีกเครื่อง ลองเปิด claude.ai ในแท็บใหม่ดูว่าล็อกอินอยู่ไหม</li><li>ไม่ได้เปิดในหน้าต่างไม่ระบุตัวตน</li></ol>
        <div class="help-row"><button class="sbtn" type="button" id="btn-retry">ลองเชื่อมต่อใหม่</button><button class="sbtn" type="button" id="btn-single">ใช้เครื่องเดียวเปิดสองหน้าต่างแทน</button></div>`;
      $('#btn-retry').onclick = () => location.reload();
      $('#btn-single').onclick = single;
      return;
    }
    n.className = 'mode-note';
    if (Sync.mode === 'firebase' && !fbBuild) n.innerHTML = '<b>โหมดออนไลน์</b> เปิดลิงก์นี้อีกเครื่อง แล้วเลือกบทบาทที่เหลือ ไม่ต้องล็อกอินอะไร';
    else if (Sync.mode === 'firebase') n.innerHTML = needCode ? '<b>ใส่รหัสห้องก่อน</b> เครื่องแรกกดสร้างรหัสใหม่ แล้วพิมพ์รหัสเดียวกันที่อีกเครื่อง' : `<b>โหมดออนไลน์</b> ห้อง ${esc(code)} เปิดลิงก์นี้อีกเครื่อง ใส่รหัสเดียวกัน แล้วเลือกบทบาทที่เหลือ ไม่ต้องล็อกอินอะไร`;
    else if (Sync.mode === 'online') n.innerHTML = '<b>โหมดออนไลน์</b> เปิดลิงก์นี้อีกเครื่อง แล้วเลือกบทบาทที่เหลือ ทั้งสองเครื่องต้องต่อเน็ตและล็อกอิน Claude';
    else if (Sync.mode === 'offline') n.innerHTML = '<b>โหมดออฟไลน์</b> ใช้เครื่องเดียว เปิดหน้านี้อีกหน้าต่างในเบราว์เซอร์เดียวกัน แล้วลากหน้าต่างจอโชว์ไปไว้บนโปรเจกเตอร์';
  };
  Sync.onChange(paint); paint();
  document.querySelectorAll('[data-role]').forEach((b) => b.addEventListener('click', () => {
    if (fbBuild && Sync.mode === 'firebase') { const code = cleanRoom($('#room-code').value); if (code.length < 4) return; store.set('bandai-room', code); }
    start(b.dataset.role);
  }));
}

async function start(role) {
  await Sync.ready;
  if (Sync.mode === 'blocked' || Sync.mode === 'noconfig' || Sync.mode === 'connecting') { store.del('bandai-role', 'session'); chooser(); return; }
  if (Sync.mode === 'firebase') {
    const code = FIXED_ROOM() || cleanRoom(store.get('bandai-room'));
    if (code.length < 4) { store.del('bandai-role', 'session'); chooser(); return; }
    Sync.fixedRoom = !!FIXED_ROOM();
    Sync.roomCode = code;
  }
  store.set('bandai-role', role, 'session');
  if (role === 'screen') { Screen.mount(); Sync.start('screen', (d) => Screen.receive(d)); }
  else { Control.mount(); Sync.start('control', (d, src) => Control.receive(d, src)); }
}

(function boot() {
  Sync.init();
  const h = (location.hash || '').slice(1);
  const role = h === 'screen' || h === 'control' ? h : store.get('bandai-role', 'session');
  if (role === 'screen' || role === 'control') start(role); else chooser();
})();

</script>
</body></html>
