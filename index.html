<style>
:root {
  color-scheme: light;
  --sky: #F58341; --cream: #FFE8CC; --cream2: #FFD9AE; --sand: #FEC58F; --yellow: #FFE9A0;
  --orange: #F58341; --orange2: #D75220; --peach: #FCC687; --shadow: #A8431A;
  --brown: #4A230C; --brown2: #8A4A24; --muted: #B0784C;
  --gold: #FFC21A; --gold2: #FFA20C; --green: #7E9A2E; --green2: #5E7A26;
  --red: #E2463A; --blue: #3C8DD9; --purple: #8E5BD6;
  --f-th: "Prompt", "Noto Sans Thai", "Leelawadee UI", sans-serif;
  --f-head: "Mitr", "Prompt", sans-serif;
  --f-px: "Silkscreen", "Courier New", monospace;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: linear-gradient(#F9A15A, #F58341 60%, #E16A33) fixed; color: var(--brown); font-family: var(--f-th); -webkit-tap-highlight-color: transparent; }
button { font-family: inherit; cursor: pointer; color: inherit; }
button:disabled { opacity: .5; cursor: default; }
:focus-visible { outline: 4px solid var(--gold2); outline-offset: 2px; }
[hidden] { display: none !important; }
img.px, .px-img { image-rendering: pixelated; image-rendering: crisp-edges; }
.pxf { font-family: var(--f-px); letter-spacing: .02em; }

/* กรอบพิกเซลครีมขอบส้ม แบบสไลด์ */
.pp { background: var(--cream); border: 5px solid var(--orange); border-radius: 8px; box-shadow: 0 7px 0 var(--shadow), 6px 7px 0 var(--shadow); position: relative; }
.pp.y, .panel { background: var(--yellow); border-color: var(--orange2); }
.pp.dark { background: #FFE0B8; }
.tag { display: inline-flex; align-items: center; gap: 8px; background: #FEE9B9; color: var(--brown); border: 4px solid var(--orange); border-radius: 8px; box-shadow: 0 4px 0 var(--shadow); font-family: var(--f-px); padding: 4px 14px; }
.outline { color: #FFF6E6; text-shadow: 3px 0 var(--orange), -3px 0 var(--orange), 0 3px var(--orange), 0 -3px var(--orange), 3px 3px var(--orange), -3px -3px var(--orange), 3px -3px var(--orange), -3px 3px var(--orange), 6px 0 #8A2E0E, -6px 0 #8A2E0E, 0 6px #8A2E0E, 0 -6px #8A2E0E, 6px 6px #8A2E0E, -6px -6px #8A2E0E, 6px -6px #8A2E0E, -6px 6px #8A2E0E, 4px 10px 0 #6D2A0C; }
.ytitle { color: var(--gold); text-shadow: 2px 0 #fff, -2px 0 #fff, 0 2px #fff, 0 -2px #fff, 2px 2px #fff, -2px -2px #fff, 2px -2px #fff, -2px 2px #fff, 5px 0 #3A1F14, -5px 0 #3A1F14, 0 5px #3A1F14, 0 -5px #3A1F14, 5px 5px #3A1F14, -5px -5px #3A1F14, 5px -5px #3A1F14, -5px 5px #3A1F14, 3px 9px 0 #3A1F14; }
.btn { font-family: var(--f-head); font-weight: 600; font-size: 20px; padding: 14px 20px; background: var(--orange); color: #fff; border: 4px solid var(--brown); box-shadow: inset -4px -5px 0 var(--orange2), inset 4px 4px 0 #FCA56A, 0 6px 0 var(--brown); border-radius: 8px; text-shadow: 2px 2px 0 var(--shadow); }
.btn:active:not(:disabled) { transform: translateY(4px); box-shadow: inset -4px -5px 0 var(--orange2), inset 4px 4px 0 #FCA56A, 0 2px 0 var(--brown); }
.btn.green { background: var(--green); box-shadow: inset -4px -5px 0 var(--green2), inset 4px 4px 0 #A7C04A, 0 6px 0 var(--brown); }
.btn.red { background: var(--red); box-shadow: inset -4px -5px 0 #B8302A, inset 4px 4px 0 #F2786E, 0 6px 0 var(--brown); }
.btn.cream { background: #FFFAF1; color: var(--brown); text-shadow: none; box-shadow: inset -4px -5px 0 var(--cream2), 0 6px 0 var(--brown); }
input[type=text], input[type=number] { font: 600 20px var(--f-th); padding: 12px 14px; background: #FFFAF1; color: var(--brown); border: 4px solid var(--brown); box-shadow: inset 3px 3px 0 var(--cream2); width: 100%; }
.conn { position: fixed; right: 8px; bottom: 8px; z-index: 90; font: 12px var(--f-th); padding: 3px 8px; background: var(--cream); border: 2px solid var(--green); color: var(--green2); }
.conn.bad { border-color: var(--red); color: var(--red); }

/* ---------- เลือกบทบาท ---------- */
.scene-bg { position: fixed; inset: 0; background-size: cover; background-position: center bottom; image-rendering: pixelated; z-index: -1; }
.chooser { min-height: 100%; display: grid; place-items: center; padding: 28px 16px; }
.chooser-inner { width: min(980px, 100%); display: grid; gap: 26px; justify-items: center; text-align: center; }
.logo-title { font-family: var(--f-px); font-weight: 700; line-height: .95; margin: 0; }
.logo-title .l1 { display: block; font-size: clamp(54px, 11vw, 120px); }
.logo-title .l2 { display: block; font-size: clamp(22px, 4vw, 40px); margin-top: 10px; }
.roles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 22px; width: 100%; }
.role { text-align: left; padding: 20px; display: grid; gap: 6px; }
.role .tag { justify-self: start; font-size: 13px; }
.role b { font-family: var(--f-head); font-size: 26px; }
.role small { color: var(--brown2); font-size: 15px; line-height: 1.5; }
.role:hover { transform: translate(-2px, -3px); }

/* ---------- มือถือผู้เล่น ---------- */
.pl { min-height: 100%; display: flex; flex-direction: column; max-width: 560px; margin: 0 auto; padding: 12px max(14px, env(safe-area-inset-left)) 120px max(14px, env(safe-area-inset-right)); gap: 16px; }
.pl-top { display: grid; grid-template-columns: auto 1fr auto auto; align-items: center; gap: 10px; padding: 8px 10px; }
.pl-top .av { width: 44px; height: 64px; display: block; }
.pl-top .me { min-width: 0; }
.pl-top .me b { display: block; font-family: var(--f-head); font-size: 18px; line-height: 1.2; overflow-wrap: anywhere; }
.pl-top .me span { font-size: 13px; color: var(--brown2); }
.pl-score { text-align: right; }
.pl-score .v { font-family: var(--f-px); font-weight: 700; font-size: 26px; color: var(--orange2); line-height: 1; }
.pl-score .l { font-size: 12px; color: var(--brown2); }
.pl-clock { font-family: var(--f-px); font-weight: 700; font-size: 18px; color: var(--cream); background: var(--brown); padding: 6px 8px; white-space: nowrap; }
.pl-clock.low { background: var(--red); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .55; } }
.status { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
.meter { display: flex; align-items: center; gap: 6px; font: 600 14px var(--f-th); color: var(--brown); background: var(--cream); border: 3px solid var(--brown); padding: 5px 10px; }
.meter i { width: 22px; height: 14px; background: var(--cream2); border: 2px solid var(--brown2); display: inline-block; }
.meter i.on { background: var(--gold); border-color: var(--orange2); }
.combo { font: 700 15px var(--f-head); color: #fff; background: var(--red); border: 3px solid var(--brown); padding: 4px 10px; animation: wob .6s ease-in-out infinite alternate; }
.shieldchip { font: 700 14px var(--f-head); background: var(--blue); color: #fff; border: 3px solid var(--brown); padding: 4px 10px; }
@keyframes wob { from { transform: rotate(-3deg); } to { transform: rotate(3deg) scale(1.05); } }
.qcard { padding: 18px 18px 20px; }
.qhead { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; gap: 8px; }
.qno { font: 700 13px var(--f-px); color: var(--orange2); }
.star { font: 700 13px var(--f-head); background: var(--gold); border: 3px solid var(--brown); padding: 2px 10px; animation: wob .5s infinite alternate; }
.qtext { font: 600 21px/1.45 var(--f-head); margin: 0; overflow-wrap: anywhere; }
.qcard.starq { background: #FFF7D1; border-color: var(--gold2); }
.opts { display: grid; gap: 12px; }
.opt { display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; min-height: 62px; padding: 10px 14px; font: 600 18px var(--f-th); background: #FFFAF1; border: 4px solid var(--brown); box-shadow: inset -4px -4px 0 var(--cream2), 5px 5px 0 var(--brown); overflow-wrap: anywhere; }
.opt:active:not(:disabled) { transform: translate(3px, 3px); box-shadow: inset -4px -4px 0 var(--cream2), 2px 2px 0 var(--brown); }
.opt .k { flex: none; width: 38px; height: 38px; display: grid; place-items: center; font: 700 16px var(--f-px); color: #fff; border: 3px solid var(--brown); }
.opt:nth-child(1) .k { background: var(--orange); } .opt:nth-child(2) .k { background: var(--green); }
.opt:nth-child(3) .k { background: var(--blue); } .opt:nth-child(4) .k { background: var(--purple); }
.opt.right { background: #E3F4CF; } .opt.right .k { background: var(--green); }
.opt.wrong { background: #FFD9D3; } .opt.wrong .k { background: var(--red); }
.fb { text-align: center; display: grid; gap: 10px; padding: 22px 18px; }
.fb .big { font: 700 40px var(--f-head); }
.fb .pts { font: 700 30px var(--f-px); color: var(--orange2); }
.fb .break { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; }
.fb .break span { font: 600 13px var(--f-th); background: var(--cream2); border: 2px solid var(--brown2); padding: 2px 8px; }
.fb .why { font-size: 16px; line-height: 1.6; text-align: left; background: #FFFAF1; padding: 12px 14px; border-left: 6px solid var(--gold2); }
.center-msg { text-align: center; display: grid; gap: 14px; padding: 24px 18px; }
.center-msg h2 { margin: 0; font: 700 26px var(--f-head); }
.center-msg p { margin: 0; color: var(--brown2); line-height: 1.6; }
.boxes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
.box { aspect-ratio: 1 / 1.15; display: grid; place-items: center; align-content: center; gap: 6px; background: #C9703A; border: 4px solid var(--brown); box-shadow: inset -5px -6px 0 #9C4F25, inset 5px 5px 0 #E58C50, 5px 5px 0 var(--brown); color: #fff; padding: 6px; position: relative; }
.box::before { content: ""; position: absolute; left: 0; right: 0; top: 34%; height: 10px; background: var(--gold); border-top: 3px solid var(--brown); border-bottom: 3px solid var(--brown); }
.box::after { content: ""; position: absolute; top: 0; bottom: 0; left: calc(50% - 7px); width: 14px; background: var(--gold); border-left: 3px solid var(--brown); border-right: 3px solid var(--brown); }
.box .q { position: relative; z-index: 2; font: 700 34px var(--f-px); text-shadow: 3px 3px 0 var(--brown); background: var(--orange); border: 3px solid var(--brown); width: 52px; height: 52px; display: grid; place-items: center; }
.box.open { background: var(--cream); box-shadow: 5px 5px 0 var(--brown); color: var(--brown); }
.box.open::before, .box.open::after { display: none; }
.box.open .ico { font-size: 40px; line-height: 1; }
.box.open .lbl { font: 700 15px var(--f-head); text-align: center; line-height: 1.25; }
.box.mine { background: #FFF7D1; outline: 5px solid var(--gold2); outline-offset: 3px; }
.box.mine.goldbox { background: var(--gold); }
.shake { animation: shake .45s steps(6) infinite; }
.shake:nth-child(2) { animation-delay: .15s; } .shake:nth-child(3) { animation-delay: .3s; }
@keyframes shake { 0%,100% { transform: translate(0,0); } 25% { transform: translate(-3px,1px) rotate(-3deg); } 75% { transform: translate(3px,-1px) rotate(3deg); } }
.targets { display: grid; gap: 10px; }
.pickbar { position: relative; height: 30px; background: #fff; border: 3px solid var(--brown); overflow: hidden; }
.pickbar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--red); transition: width .2s linear; }
.pickbar span { position: relative; font: 700 15px/24px var(--f-head); color: var(--brown); text-shadow: 0 0 3px #fff; }
.tg { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; text-align: left; padding: 8px 12px; font: 600 17px var(--f-th); background: #FFFAF1; border: 4px solid var(--brown); box-shadow: 4px 4px 0 var(--brown); }
.tg img { width: 30px; height: 46px; }
.tg span { min-width: 0; overflow-wrap: anywhere; }
.tg b { font: 700 16px var(--f-px); color: var(--orange2); }
.avpick { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.avbtn { background: #FFFAF1; border: 4px solid var(--brown); box-shadow: 4px 4px 0 var(--brown); padding: 8px 0 4px; display: grid; justify-items: center; }
.avbtn img { width: 48px; height: 72px; }
.avbtn.on { background: var(--gold); outline: 4px solid var(--orange2); outline-offset: 2px; }
.dress { display: grid; gap: 12px; padding: 14px; }
.dress-top { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.dress-top img { width: 96px; height: 144px; background: #FFFAF1; border: 4px solid var(--brown); padding: 4px; }
.dress-top h2 { margin: 0 0 6px; font: 700 22px var(--f-head); }
.dress-top p { margin: 0 0 8px; font-size: 14px; color: var(--brown2); }
.drow { display: grid; gap: 6px; }
.drow > span { font: 700 15px var(--f-head); }
.dopts { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 6px; }
.dopt { flex: none; min-width: 64px; padding: 6px 8px; background: #FFFAF1; border: 3px solid var(--brown); box-shadow: 3px 3px 0 var(--brown); font: 600 14px var(--f-th); display: grid; justify-items: center; gap: 2px; }
.dopt img { width: 32px; height: 48px; }
.dopt.on { background: var(--gold); outline: 3px solid var(--orange2); outline-offset: 1px; }
.dopt.sw { min-width: 44px; width: 44px; height: 44px; padding: 0; }
.dopt.sw.on { outline-width: 4px; }
.toast { position: fixed; left: 50%; top: 14px; transform: translateX(-50%); width: min(520px, calc(100% - 24px)); z-index: 80; background: var(--red); color: #fff; border: 4px solid var(--brown); box-shadow: 6px 6px 0 var(--brown); padding: 14px 16px; font: 700 18px var(--f-head); text-align: center; animation: drop .25s ease-out; }
.toast.good { background: var(--green); } .toast.info { background: var(--blue); }
@keyframes drop { from { transform: translate(-50%, -40px); opacity: 0; } }
.gold-banner { font: 700 16px var(--f-head); text-align: center; background: var(--gold); border: 4px solid var(--brown); padding: 6px; animation: wob .5s infinite alternate; }
body.golden .pl-top { background: #FFF7D1; border-color: var(--gold2); }
.rank-list { display: grid; gap: 8px; }
.rank-row { display: grid; grid-template-columns: 46px 30px 1fr auto; gap: 10px; align-items: center; padding: 6px 12px; background: #FFFAF1; border: 3px solid var(--brown); }
.rank-row img { width: 26px; height: 40px; }
.rank-row.me { background: var(--gold); }
.rank-row .n { font: 700 16px var(--f-px); color: var(--orange2); }
.rank-row .nm { font-weight: 600; overflow-wrap: anywhere; }
.rank-row .s { font: 700 14px var(--f-px); }
.walkers { position: fixed; left: 0; right: 0; bottom: 6px; height: 70px; pointer-events: none; z-index: 0; }
.walkers img { position: absolute; bottom: 0; width: 34px; height: 51px; animation: bob .6s steps(2) infinite; }
@keyframes bob { 50% { transform: translateY(-3px); } }
.big-count { position: fixed; inset: 0; z-index: 85; display: grid; place-items: center; background: rgba(90,46,20,.55); }
.big-count span { font: 700 min(48vw, 520px)/1 var(--f-px); animation: zoom .9s ease-out both; }
.big-count small { display: block; text-align: center; font: 700 22px var(--f-head); color: var(--cream); margin-top: 10px; }
@keyframes zoom { from { transform: scale(2.2); opacity: 0; } 30% { transform: scale(1); opacity: 1; } }

/* ---------- จอโชว์ ---------- */
.stage-wrap { position: fixed; inset: 0; overflow: hidden; background: #E16A33; }
.stage { width: 1920px; height: 1080px; position: absolute; left: 50%; top: 50%; transform-origin: center; overflow: hidden; background-size: 1920px 1080px; image-rendering: pixelated; }
.stage > * { image-rendering: auto; }
.stage.golden::before { content: ""; position: absolute; inset: 0; background: radial-gradient(circle at 80% 22%, rgba(255,212,92,.55), rgba(255,184,0,.18) 60%); z-index: 0; animation: glow 1.2s ease-in-out infinite alternate; }
@keyframes glow { to { opacity: .55; } }
.stage.quake { animation: quake .5s steps(8) 1; }
@keyframes quake { 25% { transform: translate(calc(-50% - 14px), calc(-50% + 6px)) scale(var(--k)); } 50% { transform: translate(calc(-50% + 12px), calc(-50% - 8px)) scale(var(--k)); } 75% { transform: translate(calc(-50% - 8px), calc(-50% + 4px)) scale(var(--k)); } }
.stage-in { position: absolute; inset: 0; padding: 40px 56px 0; display: grid; grid-template-rows: auto 1fr 130px; gap: 26px; z-index: 1; }
.s-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 24px; }
.s-brand { display: grid; gap: 14px; justify-items: start; }
.s-brand .tag { font-size: 22px; }
.s-brand h1 { margin: 0; font: 700 96px/0.9 var(--f-px); }
.s-brand .sub { font: 700 40px var(--f-head); }
.s-right { display: flex; gap: 24px; align-items: stretch; }
.s-count { padding: 14px 26px; text-align: center; display: grid; align-content: center; }
.s-count b { font: 700 54px/1 var(--f-px); color: var(--orange2); }
.s-count span { font: 600 22px var(--f-head); }
.s-clock { padding: 12px 30px; min-width: 380px; text-align: center; display: grid; align-content: center; }
.s-clock .t { font: 700 92px/1 var(--f-px); color: var(--brown); }
.s-clock .l { font: 600 22px var(--f-head); color: var(--brown2); }
.s-clock.low .t { color: var(--red); animation: blink 1s steps(2) infinite; }
.s-clock.gold { background: var(--gold); border-color: var(--gold2); }
.s-body { display: grid; grid-template-columns: 1fr 620px; gap: 44px; min-height: 0; }
.panel { padding: 24px 30px; min-height: 0; overflow: hidden; display: flex; flex-direction: column; gap: 16px; }
.panel h2 { margin: 0; font: 700 38px var(--f-head); display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.panel h2 small { font: 500 22px var(--f-th); color: var(--brown2); }
.lobby-join { display: grid; grid-template-columns: 430px 1fr; gap: 40px; align-items: center; }
.qrbox { position: relative; }
.qr { width: 430px; height: 430px; background: #FFFAF1; padding: 20px; border: 6px solid var(--brown); box-shadow: 8px 8px 0 var(--orange); }
.qr svg { width: 100%; height: 100%; display: block; }
.qrbox .tag { position: absolute; left: 50%; transform: translateX(-50%) rotate(-3deg); bottom: -22px; font-size: 26px; background: var(--gold); white-space: nowrap; }
.join-steps { display: grid; gap: 22px; }
.step { display: flex; gap: 18px; align-items: center; font: 600 36px var(--f-head); }
.step i { font-style: normal; flex: none; width: 60px; height: 60px; display: grid; place-items: center; font: 700 30px var(--f-px); color: #fff; background: var(--orange); border: 4px solid var(--brown); box-shadow: 4px 4px 0 var(--brown); }
.join-steps .url { font: 600 20px monospace; color: var(--brown2); overflow-wrap: anywhere; }
.rules { display: flex; flex-wrap: wrap; gap: 12px; }
.rules span { font: 600 20px var(--f-th); background: #FFFAF1; border: 3px solid var(--brown); padding: 5px 11px; }
.chips { display: flex; flex-wrap: wrap; gap: 12px; align-content: flex-start; overflow: hidden; }
.chip { display: flex; align-items: center; gap: 8px; font: 600 22px var(--f-th); padding: 4px 14px 4px 6px; background: #FFFAF1; border: 3px solid var(--brown); max-width: 290px; white-space: nowrap; }
.chip img { width: 26px; height: 40px; flex: none; }
.chips.big .chip img { width: 40px; height: 60px; }
.chip span { overflow: hidden; text-overflow: ellipsis; }
.chip.new { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.4) translateY(10px); opacity: 0; } }
.board { display: grid; gap: 7px; }
.brow { display: grid; grid-template-columns: 76px 44px 1fr 110px 170px; align-items: center; gap: 14px; height: 54px; padding: 0 18px; background: #FFFAF1; border: 3px solid var(--brown); font: 600 30px var(--f-th); }
.brow img { width: 28px; height: 42px; }
.brow .r { font: 700 26px var(--f-px); color: var(--muted); }
.brow .nm { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: center; gap: 10px; }
.brow .nm .fx { font-size: 24px; flex: none; }
.brow .mv { font: 700 22px var(--f-px); text-align: center; }
.brow .mv.up { color: var(--green2); } .brow .mv.down { color: var(--red); }
.brow .sc { font: 700 32px var(--f-px); text-align: right; color: var(--orange2); }
.brow.t1 { background: var(--gold); border-color: var(--brown); } .brow.t1 .r { color: var(--brown); }
.brow.t2, .brow.t3, .brow.t4, .brow.t5 { background: #FFF7E6; } .brow.t2 .r, .brow.t3 .r, .brow.t4 .r, .brow.t5 .r { color: var(--orange2); }
.brow.cut { border-bottom: 6px dashed var(--orange); }

var qrcode = function() {

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;

      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {

      }

      if (_dataCache == null) {

      mapData(_dataCache, maskPattern);

        for (var c = -1; c <= 7; c += 1) {

          } else {

          }

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {

          pattern = i;
        }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);

      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;

              _modules[row][col - c] = dark;
              bitIndex -= 1;

                bitIndex = 7;
              }

          if (row < 0 || _moduleCount <= row) {

          }

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var i = 0; i < rsBlocks.length; i += 1) {

      var index = 0;

        for (var r = 0; r < rsBlocks.length; r += 1) {

            index += 1;

        }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );

        totalDataCount += rsBlocks[i].dataCount;

          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);

        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);

          for (var i = 0; i < rsBlocks.length; i++) {

      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {

          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';

/* ---------- ชั้นฐานข้อมูล: Firebase จริง หรือโหมดทดสอบในเครื่อง (?local=1) ---------- */
function makeFirebaseDB() {
  const fc = window.FIREBASE_CONFIG;
  if (!firebase.apps.length) firebase.initializeApp(fc);
  const db = firebase.database();
  // กฎ Firebase ของโปรเจกต์อนุญาตเฉพาะห้อง SEOPH26 เลยเก็บเกมนี้ในกิ่งแยก quest/ ที่เกมบันไดไม่ได้อ่าน
  const root = db.ref('rooms/SEOPH26/quest/' + ROOM);
  let offset = 0, connected = false;
  const connCbs = [];
  db.ref('.info/serverTimeOffset').on('value', (s) => { offset = s.val() || 0; });
  db.ref('.info/connected').on('value', (s) => { connected = !!s.val(); connCbs.forEach((f) => f(connected)); });
  const at = (p) => (p ? root.child(p) : root);   // child('') ใช้ไม่ได้ใน Firebase
  return {
    now: () => Date.now() + offset,
    onConn: (f) => { connCbs.push(f); f(connected); },
    on: (path, cb) => { const r = at(path); const h = (s) => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    onLast: (path, n, cb) => { const r = at(path).limitToLast(n); const h = (s) => cb(s.val()); r.on('value', h); return () => r.off('value', h); },
    get: (path) => at(path).once('value').then((s) => s.val()),
    set: (path, v) => at(path).set(v),
    update: (path, v) => at(path).update(v),
    remove: (path) => at(path).remove(),
    push: (path, v) => at(path).push(v),
    tx: (path, fn) => at(path).transaction(fn).then((r) => ({ committed: r.committed, value: r.snapshot.val() })),
    stamp: () => firebase.database.ServerValue.TIMESTAMP,
  };
}

  const KEY = 'seq-local-' + ROOM;
  const bc = ('BroadcastChannel' in window) ? new BroadcastChannel(KEY) : null;
  const subs = new Set();
  const read = () => { try { return JSON.parse(store.get(KEY) || '{}'); } catch (e) { return {}; } };
  const parts = (p) => p.split('/').filter(Boolean);
  const getAt = (t, p) => parts(p).reduce((o, k) => (o == null ? null : (o[k] === undefined ? null : o[k])), t);
  const setAt = (t, p, v) => {

    for (let i = 0; i < ks.length - 1; i++) { if (typeof o[ks[i]] !== 'object' || o[ks[i]] === null) o[ks[i]] = {}; o = o[ks[i]]; }
    if (v === null || v === undefined) delete o[ks[ks.length - 1]]; else o[ks[ks.length - 1]] = v;
  };
  const write = (fn) => { const t = read(); fn(t); store.set(KEY, JSON.stringify(t)); fire(); if (bc) bc.postMessage(1); };
  const fire = () => { const t = read(); subs.forEach((s) => s(t)); };
  if (bc) bc.onmessage = fire;
  window.addEventListener('storage', (e) => { if (e.key === KEY) fire(); });
  const sub = (fn) => { subs.add(fn); setTimeout(() => fn(read()), 0); return () => subs.delete(fn); };
  const lastN = (v, n) => { if (!v) return null; const ks = Object.keys(v).sort().slice(-n); const o = {}; ks.forEach((k) => { o[k] = v[k]; }); return o; };
  let pushSeq = 0;
  return {
    now: () => Date.now(),
    onConn: (f) => f(true),
    on: (path, cb) => { let last; return sub((t) => { const v = getAt(t, path); const j = JSON.stringify(v); if (j !== last) { last = j; cb(v == null ? null : JSON.parse(j)); } }); },
    onLast: (path, n, cb) => { let last; return sub((t) => { const v = lastN(getAt(t, path), n); const j = JSON.stringify(v); if (j !== last) { last = j; cb(v); } }); },
    get: async (path) => getAt(read(), path),
    set: async (path, v) => write((t) => setAt(t, path, JSON.parse(JSON.stringify(v)))),
    update: async (path, obj) => write((t) => { for (const [k, v] of Object.entries(obj)) setAt(t, (path ? path + '/' : '') + k, v); }),
    remove: async (path) => write((t) => setAt(t, path, null)),
    push: async (path, v) => { const k = Date.now().toString(36).padStart(9, '0') + (pushSeq++).toString(36).padStart(3, '0') + rid(4); write((t) => setAt(t, path + '/' + k, v)); return { key: k }; },
    tx: async (path, fn) => { let out = { committed: false, value: null }; write((t) => { const cur = getAt(t, path); const nv = fn(cur == null ? null : JSON.parse(JSON.stringify(cur))); if (nv === undefined) { out = { committed: false, value: cur }; return; } setAt(t, path, nv); out = { committed: true, value: nv }; }); return out; },

    fbData = { pick: i, ok, q: cur, pts, br, k, until: Date.now() + (ok ? 1100 : RULES.wrongPauseMs) };
    view = 'feedback';
    myStat = { c: (myStat.c || 0) + (ok ? 1 : 0), a: (myStat.a || 0) + 1, k };
    if (ok) { k >= RULES.comboAt ? SFX.combo() : SFX.correct(); } else SFX.wrong();
    render();
    DB.set('st/' + pid, myStat);
    if (ok) await DB.tx('sc/' + pid, (v) => (v || 0) + pts);
    const earnBox = ok && myStat.c % RULES.every === 0;
    nextQ();
    if (earnBox) { const w = isLocked(game, DB.now()) ? SAFE_WEIGHTS : BOX_WEIGHTS; boxData = { kinds: [0, 1, 2].map(() => pickWeighted(w)), picked: null, done: false }; saveDeck(); }
    busy = false;
    const wait = fbData.until - Date.now();
    setTimeout(() => { if (view === 'feedback') { view = boxData && !boxData.done ? 'boxes' : 'question'; render(); } }, Math.max(0, wait));
  }

  async function pickBox(i) {
    if (!boxData || boxData.picked != null || busy) return;
    busy = true;
    // ช่วงท้ายเกม กล่องที่ยังไม่เปิดจะไม่มีแกล้ง/สวอป
    if (isLocked(game, DB.now())) boxData.kinds = boxData.kinds.map((k) => (ATTACKS.includes(k) ? pickWeighted(SAFE_WEIGHTS) : k));
    boxData.picked = i; saveDeck();
    const kind = boxData.kinds[i];
    kind === 'gold' ? SFX.gold() : SFX.box();
    render();
    await new Promise((r) => setTimeout(r, 1000));
    if (kind === 'gain' || kind === 'lose' || kind === 'gold') {
      const d = kind === 'gain' ? RULES.gain : kind === 'gold' ? RULES.gold : -RULES.lose;
      await DB.tx('sc/' + pid, (v) => Math.max(0, (v || 0) + d));
      DB.push('feed', { k: kind, f: pid, fn: myName, fa: myAv, at: DB.stamp() });
      finishBox(1900);
    } else if (kind === 'shield') {
      await DB.set('sh/' + pid, true);
      DB.push('feed', { k: 'shield', f: pid, fn: myName, fa: myAv, at: DB.stamp() });
      finishBox(1900);
    } else if (kind === 'bomb') {
      // อันดับ 1-3 (ไม่นับตัวเอง) โดนคนละ RULES.bomb คนมีโล่กันได้
      const tops = rankOf(players, sc).filter((r) => r.id !== pid).slice(0, 3);
      const hit = [], hitN = [], blN = [];
      for (const t of tops) {
        const shot = await DB.tx('sh/' + t.id, (v) => (v ? null : undefined));
        if (shot.committed) { blN.push(t.n); continue; }
        await DB.tx('sc/' + t.id, (v) => Math.max(0, (v || 0) - RULES.bomb));
        hit.push(t.id); hitN.push(t.n);
      }
      if (tops.length) { SFX.hit(); DB.push('feed', { k: 'bomb', f: pid, fn: myName, fa: myAv, ts: hit, d: hitN.join(', '), bl: blN.join(', '), at: DB.stamp() }); }
      else toast('ยังไม่มีผู้เล่นคนอื่นให้ระเบิด', 'info');
      finishBox(1900);
    } else {
      boxData.tgUntil = Date.now() + RULES.pickMs; saveDeck();
      busy = false; tgKind = kind; tgFilter = ''; view = 'target'; render();
    }
  }
  function expireTarget(msg) {
    if (view !== 'target' || busy) return;
    boxData = null; saveDeck(); tgKind = null; view = 'question';
    toast(msg, 'info'); render();
  }
  function finishBox(ms) {
    boxData.done = true; saveDeck(); busy = false; render();
    setTimeout(() => { if (boxData && boxData.done) { boxData = null; saveDeck(); view = 'question'; render(); } }, ms);
  }

  async function pickTarget(tid) {
    if (busy || !boxData || !game || game.phase !== 'play') return;
    if (isLocked(game, DB.now())) return expireTarget('🔒 30 วินาทีสุดท้าย ปิดกล่องเล่นงานเพื่อนแล้ว');
    if (boxData.tgUntil && Date.now() > boxData.tgUntil) return expireTarget('⌛ หมดเวลาเลือก กล่องหายไปแล้ว');
    busy = true;
    const tp = players[tid] || {};
    const tn = tp.n || '???', ta = tp.av || 0;
    // โล่ของเป้าหมายกันได้ 1 ครั้ง
    const shot = await DB.tx('sh/' + tid, (v) => (v ? null : undefined));
    if (shot.committed) {
      DB.push('feed', { k: 'block', f: pid, fn: myName, fa: myAv, t: tid, tn, ta, at: DB.stamp() });
      toast('🛡️ ' + tn + ' มีโล่! แกล้งไม่สำเร็จ', 'info'); SFX.shield();
    } else {
      let detail = '', up = false;
      if (tgKind === 'prank') {
        await DB.tx('sc/' + tid, (v) => Math.max(0, (v || 0) - RULES.prank));
        SFX.hit();
      } else if (tgKind === 'freeze') {
        SFX.hit();
      } else if (tgKind === 'steal') {
        const r = await DB.tx('sc', (all) => {
          all = all || {};
          const b = all[tid] || 0, take = Math.min(RULES.steal, b);
          detail = String(take);
          all[tid] = b - take; all[pid] = (all[pid] || 0) + take;
          return all;
        });
        if (!r.committed) { busy = false; toast('ขโมยไม่สำเร็จ ลองอีกครั้ง'); return; }
        SFX.swap();
      } else {
        const r = await DB.tx('sc', (all) => {
          all = all || {};
          const a = all[pid] || 0, b = all[tid] || 0;
          detail = a + ' ↔ ' + b; up = a > b;
          all[pid] = b; all[tid] = a;
          return all;
        });
        if (!r.committed) { busy = false; toast('สวอปไม่สำเร็จ ลองอีกครั้ง'); return; }
        SFX.swap();
      }
      DB.push('feed', { k: tgKind, f: pid, fn: myName, fa: myAv, t: tid, tn, ta, d: detail, up, at: DB.stamp() });
    }
    boxData = null; saveDeck(); tgKind = null;
    busy = false; view = 'question'; render();
  }

  function myRank() { const r = rankOf(players, sc); const i = r.findIndex((x) => x.id === pid); return { list: r, i }; }

  function topBar() {
    const now = DB.now();
    const left = game && game.phase === 'play' ? game.endAt - now : null;
    return `<div class="pp pl-top" id="ptop">${avImg(myAv, 'av')}
      <div class="me"><b>${esc(myName)}</b><span>${joined ? 'อันดับ ' + (myRank().i + 1) + ' / ' + Object.keys(players).length : ''}</span></div>
      ${left != null ? `<div class="pl-clock ${left < 10000 ? 'low' : ''}" id="pclock">${fmtClock(Math.min(left, game.endAt - game.startAt))}</div>` : '<span></span>'}
      <div class="pl-score"><div class="v">${(sc[pid] || 0)}</div><div class="l">แต้ม</div></div>
    </div>`;
  }
  function statusRow() {
    const n = (myStat.c || 0) % RULES.every;
    let s = ''; for (let i = 0; i < RULES.every; i++) s += `<i class="${i < n ? 'on' : ''}"></i>`;
    const k = myStat.k || 0;
    return `<div class="status" id="pstat"><div class="meter">${s}<span>อีก ${RULES.every - n} ข้อ เปิดกล่อง</span></div>
      ${k >= RULES.comboAt ? `<div class="combo">🔥 คอมโบ ${k}</div>` : ''}${sh[pid] ? '<div class="shieldchip">🛡️ มีโล่</div>' : ''}${isUnderdog() ? `<div class="helpchip">🆘 ตอบถูก +${RULES.underdog}</div>` : ''}</div>`;
  }

  function render() {
    const now = DB.now();
    document.body.classList.toggle('golden', isGolden(game, now));
    if (!joined) {
      const inGame = game && game.phase === 'play';
      const jmsg = inGame ? 'เกมเริ่มไปแล้ว เข้าได้เลย รีบตอบตามให้ทัน!' : 'รอเริ่มเกมพร้อมกันทั้งห้อง';
      if (document.getElementById('jf')) { const pm = document.getElementById('jmsg'); if (pm) pm.textContent = jmsg; return; }
      app.dataset.key = '';
      app.innerHTML = `<div class="pl"><div class="pp center-msg">
        <div><span class="tag" style="font-size:13px">OPEN HOUSE 2026</span></div>
        <h1 class="logo-title outline" style="margin:4px 0"><span class="l1" style="font-size:54px">SE QUEST</span></h1>
        <h2>ใส่ชื่อเล่น แล้วเลือกตัวละคร</h2>
        <p id="jmsg">${jmsg}</p>
        <form id="jf" style="display:grid;gap:14px"><input id="jn" type="text" maxlength="16" placeholder="ชื่อเล่น" value="${esc(myName)}" autocomplete="off" enterkeyhint="go">
        <div class="avpick">${AVS.map((_, i) => `<button type="button" class="avbtn ${i === avParts(myAv).b ? 'on' : ''}" data-av="${i}">${avImg(i)}</button>`).join('')}</div>
        <button class="btn green" type="submit" id="jbtn">เข้าเกม!</button></form>
      </div></div>`;
      document.getElementById('jf').onsubmit = (e) => { e.preventDefault(); join(document.getElementById('jn').value); };
      const jn = document.getElementById('jn');
      jn.oninput = () => { myName = jn.value; };
      app.querySelectorAll('[data-av]').forEach((b) => { b.onclick = () => { myAv = avPack(Object.assign(avParts(myAv), { b: +b.dataset.av })); SFX.unlock(); SFX.pop(); app.querySelectorAll('[data-av]').forEach((x) => x.classList.toggle('on', x === b)); }; });
      return;
    }
    // หน้าที่มีปุ่มให้กด ถ้าเนื้อหาเดิม อัปเดตแค่แต้ม/อันดับ ไม่วาดปุ่มใหม่ (กันกดแล้วไม่ติดตอนคนเล่นเยอะ)
    const same = (key) => {
      if (app.dataset.key !== key) { app.dataset.key = key; return false; }
      const t = document.getElementById('ptop'); if (t) t.outerHTML = topBar();
      const st2 = document.getElementById('pstat'); if (st2) st2.outerHTML = statusRow();
      return true;
    };
    const keyless = () => { app.dataset.key = ''; };
    if (!game || game.phase === 'lobby') {
      if (same('l|' + myAv)) return;
      const o = avParts(myAv);
      const opt = (k, i, inner, extra) => `<button type="button" class="dopt ${extra || ''} ${o[k] === i ? 'on' : ''}" data-d="${k}:${i}"${extra === 'sw' ? ` style="background:${OUTFIT.shirts[i] || 'repeating-linear-gradient(45deg,#FFFAF1 0 6px,#F3D9B8 6px 12px)'}"` : ''}>${inner}</button>`;
      const prev = (k, i) => avImg(avPack(Object.assign({}, o, { [k]: i })));
      app.innerHTML = `<div class="pl">${topBar()}<div class="pp dress">
        <div class="dress-top">${avImg(myAv)}<div><h2>เข้าเกมแล้ว! แต่งตัวรอเลย</h2><p>ชุดที่แต่งจะขึ้นบนจอใหญ่ทันที</p><button type="button" class="btn cream" id="drand" style="padding:8px 12px;font-size:15px">🎲 สุ่มชุด</button></div></div>
        <div class="drow"><span>ตัวละคร</span><div class="dopts">${AVS.map((_, i) => opt('b', i, prev('b', i))).join('')}</div></div>
        <div class="drow"><span>หมวก</span><div class="dopts">${OUTFIT.hats.map((h, i) => opt('h', i, prev('h', i) + h[0])).join('')}</div></div>
        <div class="drow"><span>แว่น</span><div class="dopts">${OUTFIT.glasses.map((h, i) => opt('g', i, prev('g', i) + h[0])).join('')}</div></div>
        <div class="drow"><span>ชุด</span><div class="dopts">${OUTFIT.uniforms.map((h, i) => opt('u', i, prev('u', i) + h[0])).join('')}</div></div>
        ${o.u ? `<div class="drow"><span>กางเกงหรือกระโปรง</span><div class="dopts">${OUTFIT.bottoms.map((h, i) => opt('w', i, prev('w', i) + h[0])).join('')}</div></div>
        <div class="drow"><span>สี${o.w ? 'กระโปรง' : 'กางเกง'}</span><div class="dopts">${OUTFIT.bcolors.map((h, i) => `<button type="button" class="dopt ${o.c === i ? 'on' : ''}" data-d="c:${i}"><i style="display:block;width:34px;height:22px;background:${h[1]};border:3px solid var(--brown)"></i>${h[0]}</button>`).join('')}</div></div>`
        : `<div class="drow"><span>สีเสื้อ</span><div class="dopts">${OUTFIT.shirts.map((c, i) => opt('s', i, '', 'sw')).join('')}</div></div>`}
        <div class="drow"><span>สัตว์เลี้ยง</span><div class="dopts">${OUTFIT.pets.map((h, i) => opt('p', i, prev('p', i) + h[0])).join('')}</div></div>
      </div><div class="pp center-msg"><p>มองขึ้นจอใหญ่ รอเริ่มเกม</p>
        <div style="text-align:left;display:grid;gap:8px;font-size:16px;line-height:1.5">
        <div>✅ ตอบถูก +${RULES.correct} · ถูกติดกัน ${RULES.comboAt} ข้อขึ้นไฟลุก 🔥 ได้โบนัส</div>
        <div>🎁 ถูกครบ ${RULES.every} ข้อ ได้เปิดกล่องสุ่ม 1 ใน 3</div>
        <div>💰 แต้มเพิ่ม · 💸 แต้มหาย · 🎯 แกล้งเพื่อน · 🔄 สวอป · 🧲 ขโมยแต้ม · ❄️ แช่แข็งเพื่อน · 💣 ระเบิดหัวตาราง · 🛡️ โล่ · 👑 กล่องทอง</div>
        <div>⭐ ข้อดาวทอง และ ✨ นาทีสุดท้าย แต้มคูณ 2</div>
        <div>🆘 อยู่ครึ่งล่างของตาราง ตอบถูกได้เพิ่ม +${RULES.underdog}</div>
        <div>⏱ ได้กล่องเล่นงานเพื่อน ต้องเลือกคนใน ${RULES.pickMs / 1000} วินาที · 🔒 30 วินาทีสุดท้ายปิดกล่องเล่นงานเพื่อน</div></div></div></div>`;
      const setAv = (v) => {
        myAv = v; pstore.set('seq-av-' + ROOM, String(v)); SFX.unlock(); SFX.pop(); render();
        clearTimeout(dressT); dressT = setTimeout(() => { DB.update('players/' + pid, { av: myAv }).catch((e) => console.error(e)); }, 250);
      };
      app.querySelectorAll('[data-d]').forEach((b) => { b.onclick = () => {
        const [k, i] = b.dataset.d.split(':'); const n = Object.assign(avParts(myAv), { [k]: +i });
        if (k === 'u' && +i !== o.u) n.c = +i === 1 ? 1 : 0;   // นิสิต มศว เริ่มที่กางเกงดำ นักเรียนเริ่มที่กรมท่า
        setAv(avPack(n));
      }; });
      const rb = document.getElementById('drand');
      if (rb) rb.onclick = () => { const r = (n) => Math.floor(Math.random() * n); setAv(avPack({ b: r(AVS.length), h: r(OUTFIT.hats.length), g: r(OUTFIT.glasses.length), s: r(OUTFIT.shirts.length), p: r(OUTFIT.pets.length), u: r(OUTFIT.uniforms.length), w: r(2), c: r(OUTFIT.bcolors.length) })); };
      return;
    }
    if (game.phase === 'end' || now > game.endAt) {
      keyless();
      const { list, i } = myRank();
      const rows = list.slice(0, 5).map((r, k) => `<div class="rank-row ${r.id === pid ? 'me' : ''}"><span class="n">#${k + 1}</span>${avImg(r.av)}<span class="nm">${esc(r.n)}</span><span class="s">${r.s}</span></div>`).join('');
      app.innerHTML = `<div class="pl">${topBar()}<div class="pp center-msg"><h2>หมดเวลา!</h2><p>คุณได้อันดับ <b style="color:var(--orange2);font-size:22px">${i + 1}</b> ด้วย ${sc[pid] || 0} แต้ม<br>ดูประกาศผลบนจอใหญ่</p></div><div class="pp" style="padding:14px"><div class="rank-list">${rows}</div></div></div>`;
      return;
    }
    if (now < game.startAt) {
      keyless();
      app.innerHTML = `<div class="pl">${topBar()}<div class="pp center-msg"><h2>เตรียมตัว!</h2><p>เกมกำลังจะเริ่ม</p></div></div>`;
      return;
    }
    const goldBanner = isGolden(game, now) ? '<div class="gold-banner">✨ นาทีทอง! ตอบถูกได้แต้มคูณ 2 ✨</div>' : '';
    if (view === 'feedback' && fbData) {
      if (same('f|' + fbData.until)) return;
      const q = QUESTIONS[fbData.q];
      if (fbData.ok) {
        app.innerHTML = `<div class="pl">${topBar()}${goldBanner}<div class="pp fb"><div class="big" style="color:var(--green2)">ถูกต้อง!</div><div class="pts">+${fbData.pts}</div><div class="break">${fbData.br.map((b) => `<span>${esc(b)}</span>`).join('')}</div>${fbData.k >= RULES.comboAt ? `<div class="combo" style="justify-self:center">🔥 ถูกติดกัน ${fbData.k} ข้อ</div>` : ''}</div></div>`;
      } else {
        const opts = q.o.map((o, k) => `<div class="opt ${k === q.a ? 'right' : (k === fbData.pick ? 'wrong' : '')}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></div>`).join('');
        app.innerHTML = `<div class="pl">${topBar()}<div class="pp fb"><div class="big" style="color:var(--red)">ยังไม่ใช่!</div><div class="why">💡 ${esc(q.w)}</div></div><div class="opts">${opts}</div></div>`;
      }
      return;
    }
    if (view === 'boxes' && boxData) {
      const done = boxData.picked != null;
      if (same('b|' + boxData.kinds.join() + '|' + boxData.picked + '|' + !!boxData.done)) return;

      const res = done ? BOX_INFO[boxData.kinds[boxData.picked]] : null;

    if (view === 'target') {
      const others = rankOf(players, sc).filter((r) => r.id !== pid);

      const f = tgFilter.trim().toLowerCase();
      const shown = others.filter((r) => !f || r.n.toLowerCase().includes(f));
      const title = { prank: '🎯 เลือกคนที่จะแกล้ง', swap: '🔄 เลือกคนที่จะสวอปแต้มด้วย', steal: '🧲 เลือกคนที่จะขโมยแต้ม', freeze: '❄️ เลือกคนที่จะแช่แข็ง' }[tgKind];
      const sub = {
        prank: 'แต้มของเขาจะลด ' + RULES.prank + ' (ไม่ต่ำกว่า 0)',
        swap: 'แต้มของคุณ ' + (sc[pid] || 0) + ' จะสลับกับของเขาทั้งก้อน',
        steal: 'ดูดแต้มเขามา ' + RULES.steal + ' แต้ม (ถ้าเขามีน้อยกว่านั้น ได้เท่าที่มี)',
        freeze: 'มือถือเขาจะกดตอบไม่ได้ ' + RULES.freezeMs / 1000 + ' วินาที',
      }[tgKind] + ' · คนมี 🛡️ จะกันได้';
      const tl = Math.max(0, Math.ceil(((boxData && boxData.tgUntil) || Date.now()) - Date.now()) / 1000);
      app.innerHTML = `<div class="pl">${topBar()}<div class="pp center-msg" style="padding:16px"><h2 style="font-size:22px">${title}</h2><p>${sub}</p><div class="pickbar"><i id="pickfill" style="width:${Math.min(100, tl / (RULES.pickMs / 1000) * 100)}%"></i><span id="picktxt">เลือกภายใน ${Math.ceil(tl)} วินาที</span></div></div>
        ${others.length > 8 ? `<input id="tf" type="text" placeholder="ค้นหาชื่อ" value="${esc(tgFilter)}" autocomplete="off">` : ''}
        <div class="targets">${shown.map((r) => `<button class="tg" data-t="${esc(r.id)}">${avImg(r.av)}<span>${sh[r.id] ? '🛡️ ' : ''}${esc(r.n)}</span><b>${r.s}</b></button>`).join('')}</div>
        ${others.length ? '' : '<div class="pp center-msg"><p>ยังไม่มีผู้เล่นคนอื่น</p><button class="btn cream" id="skipt">ข้ามไปก่อน</button></div>'}</div>`;
      app.querySelectorAll('[data-t]').forEach((b) => { b.onclick = () => pickTarget(b.dataset.t); });
      const tf = document.getElementById('tf');
      if (tf) { tf.oninput = () => { tgFilter = tf.value; const pos = tf.selectionStart; render(); const n = document.getElementById('tf'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} }; }
      const sk = document.getElementById('skipt');
      if (sk) sk.onclick = () => { boxData = null; saveDeck(); view = 'question'; render(); };
      return;
    }
    const q = QUESTIONS[cur];
    if (!q) { nextQ(); return render(); }
    const fz = isFrozen();
    if (same('q|' + deckGid + '|' + cur + '|' + (myStat.a || 0) + '|' + !!goldBanner + '|' + fz)) return;
    const ice = fz ? `<div class="ice"><div><span class="sn">❄️</span><b id="icet">${Math.ceil((frozenUntil - Date.now()) / 1000)}</b>โดนแช่แข็ง!<small style="font-size:18px">รอแป๊บ เดี๋ยวกดตอบได้</small></div></div>` : '';
    app.innerHTML = ice + `<div class="pl">${topBar()}${goldBanner}${statusRow()}<div class="pp qcard ${curStar ? 'starq' : ''}"><div class="qhead"><span class="qno">ข้อที่ ${(myStat.a || 0) + 1}</span>${curStar ? '<span class="star">⭐ ข้อดาว ×2</span>' : ''}</div><p class="qtext">${esc(q.q)}</p></div>
      <div class="opts">${q.o.map((o, k) => `<button class="opt" data-o="${k}"><span class="k">${'ABCD'[k]}</span><span>${esc(o)}</span></button>`).join('')}</div></div>`;
    app.querySelectorAll('[data-o]').forEach((b) => { b.onclick = () => answer(+b.dataset.o); });
  }

  // นาฬิกา นับถอยหลังก่อนเริ่ม และเสียงติ๊ก 10 วินาทีสุดท้าย
  let ov = null, wasGolden = false, wasPre = false, wasLocked = false;
  setInterval(() => {
    if (!game || game.phase !== 'play' || !joined) { if (ov) { ov.remove(); ov = null; } return; }
    const now = DB.now();
    if (now < game.startAt) {
      wasPre = true;
      const n = Math.ceil((game.startAt - now) / 1000);
      if (n !== lastCount) { lastCount = n; if (!ov) { ov = document.createElement('div'); ov.className = 'big-count'; document.body.appendChild(ov); } ov.innerHTML = `<div><span class="outline">${n}</span><small>เตรียมตัว!</small></div>`; SFX.beep(); }
      return;
    }
    if (ov) { ov.remove(); ov = null; }
    if (wasPre) { wasPre = false; SFX.go(); render(); }
    const left = game.endAt - now;
    const g = isGolden(game, now);
    if (g !== wasGolden) { wasGolden = g; if (g) { toast('✨ นาทีทอง! แต้มคูณ 2', 'good'); SFX.gold(); } if (view === 'question') render(); }
    const lk = isLocked(game, now);
    if (lk !== wasLocked) { wasLocked = lk; if (lk && left > 0) { toast('🔒 30 วินาทีสุดท้าย ปิดกล่องเล่นงานเพื่อน', 'info'); if (view === 'target') expireTarget('🔒 30 วินาทีสุดท้าย ปิดกล่องเล่นงานเพื่อนแล้ว'); } }
    if (frozenUntil) {
      if (Date.now() >= frozenUntil) { frozenUntil = 0; render(); }
      else { const it = document.getElementById('icet'); if (it) it.textContent = Math.ceil((frozenUntil - Date.now()) / 1000); }
    }
    if (view === 'target' && boxData && boxData.tgUntil) {
      const ms = boxData.tgUntil - Date.now();
      if (ms <= 0) expireTarget('⌛ หมดเวลาเลือก กล่องหายไปแล้ว');
      else { const f = document.getElementById('pickfill'), tx = document.getElementById('picktxt'); if (f) f.style.width = Math.min(100, ms / RULES.pickMs * 100) + '%'; if (tx) tx.textContent = 'เลือกภายใน ' + Math.ceil(ms / 1000) + ' วินาที'; }
    }
    if (left <= 0) { render(); return; }
    const sec = Math.ceil(left / 1000);
    if (sec <= 10 && sec !== lastTick) { lastTick = sec; SFX.tick(); }
    const el = document.getElementById('pclock');
    if (el) { el.textContent = fmtClock(left); el.classList.toggle('low', left < 10000); }
  }, 200);
  render();
}

/* ================= จอโชว์ (โปรเจกเตอร์) ================= */
function startScreen() {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="stage-wrap"><div class="stage" id="stage" style="background-image:url(${ASSETS.bgScreen})"><div class="stage-in" id="stage-in"></div></div></div>`;
  const stage = document.getElementById('stage');
  const content = document.getElementById('stage-in');
  let K = 1;
  const fit = () => { K = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.setProperty('--k', K); stage.style.transform = 'translate(-50%, -50%) scale(' + K + ')'; };
  addEventListener('resize', fit); fit();
  // ปุ่มเปิดเสียง (เบราว์เซอร์ต้องให้คนกดก่อนถึงจะมีเสียง)
  const sb = document.createElement('button');
  sb.className = 'btn sound-btn'; sb.textContent = '🔊 แตะเพื่อเปิดเสียง';
  sb.onclick = () => { SFX.unlock(); SFX.go(); sb.remove(); };
  stage.appendChild(sb);

  let game = null, players = {}, sc = {}, st = {}, sh = {}, feed = [];
  const seen = new Set(); let feedReady = false; let lastTop = {};
  const blasts = []; let blasting = false;
  let prevRank = {}, moves = {}, leadId = null, lastLeadAt = 0;
  let revealGid = null, revealStep = 99, revealTimer = null, podDone = {}, champDone = false;
  const chipSeen = new Set(); const feedSeenUI = new Set();

  DB.on('game', (g) => { game = g; render(); });
  let plReady = false, stReady = false;
  DB.on('players', (p) => {
    p = p || {};
    // คนเข้ากลางเกม ขึ้นป้ายเล็กมุมจอ
    if (plReady && live()) for (const [id, v] of Object.entries(p)) if (!players[id] && v) joinPop(v);
    players = p; plReady = true; render();
  });
  DB.on('sc', (s) => { sc = s || {}; render(); });
  DB.on('st', (s) => {
    s = s || {};
    // ถูกติดกันครบทุก 5 ข้อ ขึ้น ON FIRE
    if (stReady && live()) for (const [id, v] of Object.entries(s)) {
      const k = (v && v.k) || 0, pk = (st[id] && st[id].k) || 0;
      if (k !== pk && k >= RULES.fireAt && k % RULES.fireAt === 0 && players[id]) queueBlast({ k: 'fire', fn: players[id].n, fa: players[id].av || 0, d: k });
    }
    st = s; stReady = true; render();
  });
  DB.on('sh', (s) => { sh = s || {}; render(); });
  DB.onLast('feed', 7, (f) => {
    const items = Object.entries(f || {}).sort((a, b) => (a[0] < b[0] ? -1 : 1));
    feed = items.map(([k, v]) => Object.assign({ _k: k }, v)).filter((v) => v.k).reverse();
    for (const [k, v] of items) {
      if (seen.has(k)) continue; seen.add(k);
      if (feedReady && v && game && game.phase === 'play' && ['prank', 'swap', 'gold', 'block', 'steal', 'freeze', 'bomb'].includes(v.k)) queueBlast(v);
    }
    feedReady = true; render();
  });
  const live = () => game && game.phase === 'play' && DB.now() < game.endAt;
  const pops = document.createElement('div'); pops.className = 'joinpops'; stage.appendChild(pops);
  function joinPop(p) {
    const el = document.createElement('div'); el.className = 'pp joinpop';
    el.innerHTML = avImg(p.av) + '<span>' + esc(p.n) + ' เข้าร่วมแล้ว!</span>';
    pops.appendChild(el); SFX.pop();
    while (pops.children.length > 4) pops.firstChild.remove();
    setTimeout(() => el.classList.add('out'), 2600); setTimeout(() => el.remove(), 3100);
  }
  function coinRain() {
    const cv = document.createElement('canvas'); cv.className = 'fw'; cv.width = 1920; cv.height = 1080; stage.appendChild(cv);
    const g = cv.getContext('2d'); const cs = [];
    for (let i = 0; i < 90; i++) cs.push({ x: Math.random() * 1920, y: -40 - Math.random() * 900, v: 7 + Math.random() * 8, s: 22 + Math.random() * 16, p: Math.random() * 6 });
    let t = 0;
    const loop = () => {
      t++; g.clearRect(0, 0, 1920, 1080);
      for (const c of cs) {
        c.y += c.v; c.p += 0.15;
        const w = Math.max(4, Math.abs(Math.cos(c.p)) * c.s), x = Math.round(c.x / 4) * 4, y = Math.round(c.y / 4) * 4;
        g.fillStyle = '#7A4A12'; g.fillRect(x - w / 2 - 3, y - c.s / 2 - 3, w + 6, c.s + 6);
        g.fillStyle = '#FFD45C'; g.fillRect(x - w / 2, y - c.s / 2, w, c.s);
        g.fillStyle = '#FFF3DC'; g.fillRect(x - w / 4, y - c.s / 3, Math.max(2, w / 4), c.s / 3);
      }
      if (t < 170) requestAnimationFrame(loop); else cv.remove();
    };
    loop();
  }
  function clearBlasts() { blasts.length = 0; stage.querySelectorAll('.blast').forEach((e) => e.remove()); blasting = false; }
  function queueBlast(v) { if (!live()) return; blasts.push(v); runBlast(); }
  function runBlast() {
    if (blasting || !blasts.length) return;
    if (!live()) { clearBlasts(); return; }   // หมดเวลาแล้วไม่โชว์ป้ายเด้ง จะได้ไม่บังประกาศผล
    blasting = true;
    const v = blasts.shift();
    const el = document.createElement('div');
    el.className = 'pp blast ' + v.k;
    const who = v.k === 'block' ? (v.ta || 0) : (v.fa || 0);
    const msg = {
      prank: [`PRANK!`, `${esc(v.fn)} แกล้ง ${esc(v.tn)}`, `ลบ ${RULES.prank} แต้ม 💥`],
      swap: [`SWAP!`, `${esc(v.fn)} สวอปกับ ${esc(v.tn)}`, esc(v.d)],
      gold: [`JACKPOT!`, `${esc(v.fn)} เปิดได้กล่องทอง`, `+${RULES.gold} แต้ม 👑`],
      block: [`BLOCK!`, `${esc(v.tn)} ใช้โล่กัน ${esc(v.fn)}`, `แกล้งไม่เข้า 🛡️`],
      lead: [`NEW #1!`, `${esc(v.fn)} แซงขึ้นที่ 1`, `${v.d} แต้ม 👑`],
      steal: [`STEAL!`, `${esc(v.fn)} ขโมยแต้ม ${esc(v.tn)}`, `ดูดไป ${esc(v.d)} แต้ม 🧲`],
      freeze: [`FREEZE!`, `${esc(v.fn)} แช่แข็ง ${esc(v.tn)}`, `กดตอบไม่ได้ ${RULES.freezeMs / 1000} วินาที ❄️`],
      bomb: [`BOOM!`, `${esc(v.fn)} ปาระเบิดใส่หัวตาราง`, v.d ? `${esc(v.d)} โดน -${RULES.bomb} 💣` + (v.bl ? ` · ${esc(v.bl)} มีโล่` : '') : `${esc(v.bl)} มีโล่กันได้หมด 🛡️`],
      fire: [`ON FIRE!`, `${esc(v.fn)} ตอบถูกติดกัน ${v.d} ข้อ`, `ไฟลุกแล้ว ใครจะหยุดได้ 🔥`],
    }[v.k];
    el.innerHTML = `${avImg(who)}<div><span class="kind">${msg[0]}</span><div class="msg">${msg[1]}<small>${msg[2]}</small></div></div>`;
    stage.appendChild(el);
    if (v.k === 'prank' || v.k === 'bomb') { SFX.hit(); stage.classList.remove('quake'); void stage.offsetWidth; stage.classList.add('quake'); }
    else if (v.k === 'swap' || v.k === 'steal') SFX.swap(); else if (v.k === 'gold' || v.k === 'lead') SFX.gold(); else if (v.k === 'fire') SFX.combo(); else if (v.k === 'freeze') SFX.shield(); else SFX.shield();
    if (v.k === 'gold') coinRain();
    setTimeout(() => { el.remove(); blasting = false; runBlast(); }, blasts.length > 2 ? 1300 : 2400);
  }

  let qrCache = {};
  function qrSVG(url) {
    if (qrCache[url]) return qrCache[url];
    try { const q = qrcode(0, 'M'); q.addData(url); q.make(); qrCache[url] = q.createSvgTag({ cellSize: 8, margin: 0, scalable: true }); }
    catch (e) { qrCache[url] = '<div style="color:#000;font-size:24px">' + esc(url) + '</div>'; }
    return qrCache[url];
  }
  const playerURL = () => { const u = new URL(location.href); u.search = ''; u.hash = ''; u.searchParams.set('role', 'player'); if (ROOM !== 'ROYALE26') u.searchParams.set('room', ROOM); if (LOCAL) u.searchParams.set('local', '1'); return u.toString(); };

  function head(right) {
    return `<div class="s-head"><div class="s-brand"><span class="tag">OPEN HOUSE 2026 · SOCIAL ENTERPRISE</span><h1 class="outline">SE QUEST</h1><span class="sub ytitle">ตอบให้ไว แกล้งให้มัน</span></div><div class="s-right">${right || ''}</div></div>`;
  }
  const foot = (x0 = 30) => `<div class="s-foot">${Object.values(players).slice(0, x0 > 30 ? 11 : 14).map((p, i) => `<img class="px" alt="" src="${avSrc(p.av || 0)}" style="left:${x0 + i * 130}px;animation-delay:${i * 0.11}s">`).join('')}</div>`;

  function render() {
    const n = Object.keys(players).length;
    const now = DB.now();
    const phase = game ? game.phase : 'lobby';
    stage.classList.toggle('golden', isGolden(game, now));
    if (phase === 'lobby') {
      const chips = Object.entries(players).sort((a, b) => (a[1].j || 0) - (b[1].j || 0)).map(([id, p]) => { const nw = !chipSeen.has(id); chipSeen.add(id); return `<span class="chip ${nw ? 'new' : ''}">${avImg(p.av)}<span>${esc(p.n)}</span></span>`; }).join('');
      const url = playerURL();
      content.innerHTML = head(`<div class="pp s-count"><b>${n}</b><span>คนเข้าเกมแล้ว</span></div>`) + `<div class="s-body">
        <div class="pp panel"><div class="lobby-join"><div class="qrbox"><div class="qr">${qrSVG(url)}</div><span class="tag">SCAN ME!</span></div>
        <div class="join-steps"><div class="step"><i>1</i>สแกน QR ด้วยมือถือ</div><div class="step"><i>2</i>ใส่ชื่อ เลือกตัวละคร</div><div class="step"><i>3</i>รอเริ่มเกมพร้อมกัน</div><div class="url">${esc(url)}</div></div></div>
        <div class="rules" style="margin-top:20px"><span>✅ ถูก +${RULES.correct}</span><span>🔥 คอมโบ +${RULES.comboBonus}</span><span>🎁 ถูก ${RULES.every} ข้อ เปิดกล่อง</span><span>⭐ ข้อดาว ✨ นาทีทอง ×2</span><span>🧲 ขโมย ❄️ แช่แข็ง 💣 ระเบิด</span><span>🆘 ครึ่งล่าง +${RULES.underdog}</span><span>🔒 30 วิท้ายห้ามแกล้ง</span><span>🏆 5 อันดับแรกชนะ</span></div></div>
        <div class="pp panel"><h2>ผู้เล่น <small>${n} คน · แต่งตัวรอได้บนมือถือ</small></h2><div class="chips ${n <= 30 ? 'big' : ''}">${chips || '<span class="empty">ยังไม่มีใครเข้า สแกนเลย!</span>'}</div></div></div>` + foot();
      return;
    }
    const list = rankOf(players, sc);
    if (phase === 'end') { clearBlasts(); renderResults(list, n); return; }
    if (revealTimer) { clearTimeout(revealTimer); revealTimer = null; }
    const left = game.endAt - now;
    const g = isGolden(game, now);
    // ลูกศรขึ้นลงอันดับ + ตรวจคนแซงขึ้นที่ 1
    list.forEach((r, i) => { const p = prevRank[r.id]; if (p != null && p !== i) moves[r.id] = { d: p - i, until: Date.now() + 4000 }; prevRank[r.id] = i; });
    const top1 = list[0];
    if (top1 && top1.s > 0 && now >= game.startAt) {
      if (leadId && leadId !== top1.id && Date.now() - lastLeadAt > 6000) { lastLeadAt = Date.now(); queueBlast({ k: 'lead', fn: top1.n, fa: top1.av, d: top1.s }); }
      leadId = top1.id;
    }
    const top = list.slice(0, 8);
    const rows = top.map((r, i) => {
      const fl = lastTop[r.id] != null && lastTop[r.id] !== r.s;
      const mv = moves[r.id] && moves[r.id].until > Date.now() ? moves[r.id].d : 0;
      const k = (st[r.id] && st[r.id].k) || 0;
      return `<div class="brow t${i + 1} ${i === 4 && top.length > 5 ? 'cut' : ''} ${fl ? 'flash' : ''}"><span class="r">#${i + 1}</span>${avImg(r.av)}<span class="nm"><span style="overflow:hidden;text-overflow:ellipsis">${esc(r.n)}</span>${k >= RULES.comboAt ? `<span class="fx">🔥${k}</span>` : ''}${sh[r.id] ? '<span class="fx">🛡️</span>' : ''}</span><span class="mv ${mv > 0 ? 'up' : mv < 0 ? 'down' : ''}">${mv > 0 ? '▲' + mv : mv < 0 ? '▼' + (-mv) : ''}</span><span class="sc">${r.s}</span></div>`;
    }).join('');
    lastTop = {}; top.forEach((r) => { lastTop[r.id] = r.s; });
    const fd = feed.slice(0, 7).map((f) => { const nw = !feedSeenUI.has(f._k); feedSeenUI.add(f._k); return `<div class="fd ${esc(f.k)} ${nw ? 'new' : ''}">${feedText(f)}</div>`; }).join('');
    content.innerHTML = head(`<div class="pp s-count"><b>${n}</b><span>คนกำลังเล่น</span></div><div class="pp s-clock ${left < 10000 ? 'low' : ''} ${g ? 'gold' : ''}"><div class="t" id="sclock">${fmtClock(Math.min(left, game.endAt - game.startAt))}</div><div class="l">${g ? '✨ นาทีทอง ×2' : 'เวลาที่เหลือ'}</div></div>`) + `<div class="s-body">
      <div class="pp panel"><h2>🏆 อันดับสด <small>5 อันดับแรกตอนหมดเวลาชนะ</small></h2><div class="board">${rows || '<span class="empty">รอผู้เล่นตอบข้อแรก</span>'}</div></div>
      <div class="pp panel"><h2>📣 เกิดอะไรขึ้นบ้าง</h2><div class="feed">${fd || '<span class="empty">ยังไม่มีใครเปิดกล่อง</span>'}</div></div></div>` + foot(470) +
      `<div class="pp lateqr"><div class="lq">${qrSVG(playerURL())}</div><div><b>มาสาย?</b><span>สแกนเข้าเกมได้เลย</span></div></div>` +
      (g ? `<div class="marquee"><div>✨ นาทีทอง! ตอบถูกได้แต้มคูณ 2 ✨ ใครตามอยู่ รีบแซงเลย! ✨ นาทีทอง! ตอบถูกได้แต้มคูณ 2 ✨</div></div>` : '');
  }

  // ประกาศผล: เผยทีละอันดับจากที่ 5 ไปที่ 2 ตีกลอง แล้วเปิดที่ 1 พร้อมพลุ
  function renderResults(list, n) {
    if (revealGid !== game.gid) { revealGid = game.gid; revealStep = 0; podDone = {}; champDone = false; stepReveal(); }
    const top = list.slice(0, 5);
    const shownFrom = Math.max(1, 5 - revealStep);   // rank index ที่เริ่มโชว์ (1..4)
    const pods = top.slice(1).map((r, j) => { const i = j + 1; const vis = i >= shownFrom && revealStep > 0; return `<div class="pod ${vis ? '' : 'wait'} ${vis && i === shownFrom && revealStep <= 4 && !podDone[i] ? (podDone[i] = 'fresh') : ''}">` + `<span class="r">#${i + 1}</span>${avImg(r.av)}<span class="nm">${esc(r.n)}</span><span class="sc">${r.s}</span></div>`; }).join('');
    const champShown = revealStep >= 6;
    const c = top[0];
    content.innerHTML = head(`<div class="pp s-count"><b>${n}</b><span>คนร่วมเล่น</span></div>`) + `<div class="results">
      <div class="pp panel"><h2>🏆 5 อันดับแรก <small>หมดเวลาแล้ว!</small></h2><div class="podium">${pods || '<span class="empty">มีผู้เล่นคนเดียว</span>'}</div></div>
      <div class="pp panel champ ${champShown && !champDone ? (champDone = 'show') : ''}">${c ? (champShown ? `<div class="crown">👑</div>${avImg(c.av)}<div class="nm">${esc(c.n)}</div><div class="sc">${c.s} แต้ม</div><span class="tag" style="font-size:26px;background:var(--gold)">CHAMPION!</span>` : (revealStep >= 5 ? '<div class="drum">🥁 และที่ 1 คือ...</div>' : '<div class="drum" style="animation:none">อันดับ 1 รอประกาศ...</div>')) : '<span class="empty">ไม่มีผู้เล่น</span>'}</div></div>` + foot();
  }
  function stepReveal() {
    if (!game || game.phase !== 'end') return;
    revealStep++;
    if (revealStep <= 4) SFX.pop(); else if (revealStep === 5) SFX.drum(); else if (revealStep === 6) { SFX.fanfare(); fireworks(); }
    render();
    if (revealStep < 6) revealTimer = setTimeout(stepReveal, revealStep === 5 ? 2200 : 1100);
  }
  function fireworks() {
    const cv = document.createElement('canvas'); cv.className = 'fw'; cv.width = 1920; cv.height = 1080; stage.appendChild(cv);
    const g = cv.getContext('2d'); const parts = []; const cols = ['#FFD45C', '#F07A2A', '#E2463A', '#6DA544', '#3C8DD9', '#FFF3DC', '#8E5BD6'];
    const burst = (x, y) => { for (let i = 0; i < 70; i++) { const a = Math.random() * Math.PI * 2, s = 3 + Math.random() * 9; parts.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, l: 60 + Math.random() * 40, c: cols[i % cols.length] }); } };
    let t = 0;
    const loop = () => {
      t++;
      if (t % 22 === 1 && t < 260) burst(300 + Math.random() * 1320, 150 + Math.random() * 450);
      if (t < 300) for (let i = 0; i < 6; i++) parts.push({ x: Math.random() * 1920, y: -10, vx: (Math.random() - .5) * 2, vy: 3 + Math.random() * 4, l: 200, c: cols[(Math.random() * cols.length) | 0], conf: 1 });
      g.clearRect(0, 0, 1920, 1080);
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i]; p.x += p.vx; p.y += p.vy; p.vy += p.conf ? 0.02 : 0.18; p.vx *= 0.985; p.l--;
        if (p.l <= 0 || p.y > 1100) { parts.splice(i, 1); continue; }
        g.fillStyle = p.c; const s = p.conf ? 12 : 8; g.fillRect(Math.round(p.x / 4) * 4, Math.round(p.y / 4) * 4, s, p.conf ? 8 : s);
      }
      if (t < 520 || parts.length) requestAnimationFrame(loop); else cv.remove();
    };
    loop();
  }

  // นาฬิกา นับ 3 2 1 ก่อนเริ่ม เลขใหญ่ 10 วินาทีสุดท้าย และปิดเกมเองเมื่อหมดเวลา
  let ov = null, lastN = null, tenEl = null, wasGolden = false, wasPre = false;
  setInterval(() => {
    if (!game || game.phase !== 'play') { if (ov) { ov.remove(); ov = null; } if (tenEl) { tenEl.remove(); tenEl = null; } return; }
    const now = DB.now();
    if (now < game.startAt) {
      wasPre = true;
      const c = Math.ceil((game.startAt - now) / 1000);
      if (c !== lastN) { lastN = c; if (!ov) { ov = document.createElement('div'); ov.className = 'overlay'; stage.appendChild(ov); } ov.innerHTML = `<div><div class="n outline">${c}</div><div class="cap">เตรียมตัว! คำถามกำลังมา</div></div>`; SFX.beep(); }
      return;
    }
    if (wasPre) { wasPre = false; lastN = null; if (!ov) { ov = document.createElement('div'); ov.className = 'overlay'; stage.appendChild(ov); } ov.innerHTML = '<div class="go outline">GO!</div>'; SFX.go(); const o = ov; ov = null; setTimeout(() => o.remove(), 900); render(); }
    const left = game.endAt - now;
    const g = isGolden(game, now);
    if (g !== wasGolden) { wasGolden = g; if (g) SFX.gold(); render(); }
    if (left <= 0) clearBlasts();
    if (left < -800) { DB.tx('game', (gg) => { if (gg && gg.phase === 'play' && DB.now() > gg.endAt) gg.phase = 'end'; return gg; }); return; }
    const sec = Math.ceil(left / 1000);
    if (sec <= 10 && sec >= 1) {
      if (!tenEl || tenEl.dataset.s !== String(sec)) { if (tenEl) tenEl.remove(); tenEl = document.createElement('div'); tenEl.className = 'tenner outline'; tenEl.dataset.s = String(sec); tenEl.textContent = sec; stage.appendChild(tenEl); SFX.tick(); }
    } else if (tenEl) { tenEl.remove(); tenEl = null; }
    const el = document.getElementById('sclock');
    if (el) el.textContent = fmtClock(left);
    const box = el && el.closest('.s-clock'); if (box) box.classList.toggle('low', left < 10000);
  }, 200);
  setInterval(() => { if (game && game.phase === 'play' && Object.values(moves).some((m) => m.until < Date.now() + 200 && m.until > Date.now() - 400)) render(); }, 1000);
  render();
}

/* ================= จอควบคุม ================= */
function startMC() {
  const app = document.getElementById('app');
  document.body.insertAdjacentHTML('afterbegin', `<div class="scene-bg" style="background-image:url(${ASSETS.bgPhone})"></div>`);
  let game = null, players = {}, sc = {};
  let mins = +(store.get('seq-mins') || RULES.defaultMinutes);
  DB.on('game', (g) => { game = g; render(); });
  DB.on('players', (p) => { players = p || {}; render(); });
  DB.on('sc', (s) => { sc = s || {}; render(); });

  async function startGame() {
    const m = Math.min(30, Math.max(1, +document.getElementById('mins').value || RULES.defaultMinutes));
    mins = m; store.set('seq-mins', String(m));
    const zero = {}; Object.keys(players).forEach((id) => { zero[id] = 0; });
    await DB.set('sc', zero);
    await DB.remove('st'); await DB.remove('sh'); await DB.remove('feed');
    const now = DB.now();
    const startAt = now + RULES.countdownMs;
    await DB.set('game', { phase: 'play', startAt, endAt: startAt + m * 60000, mins: m, gid: rid(8) });
  }
  async function addMin() { if (!game || game.phase !== 'play') return; await DB.tx('game', (g) => { if (!g) return g; g.endAt += 60000; return g; }); }
  async function endNow() { if (!game) return; if (!confirmBtn('end')) return; await DB.tx('game', (g) => { if (!g) return g; g.phase = 'end'; g.endAt = Math.min(g.endAt, DB.now()); return g; }); }
  async function replay() { if (!game) return; await DB.tx('game', (g) => { if (!g) return g; g.gid = rid(8); return g; }); }
  async function toLobby() { if (!confirmBtn('lobby')) return; await DB.set('game', { phase: 'lobby', gid: null }); await DB.remove('feed'); }
  async function wipe() { if (!confirmBtn('wipe')) return; await DB.remove('players'); await DB.remove('sc'); await DB.remove('st'); await DB.remove('sh'); await DB.remove('feed'); await DB.set('game', { phase: 'lobby' }); }
  async function kick(id) { await DB.remove('players/' + id); await DB.remove('sc/' + id); await DB.remove('st/' + id); await DB.remove('sh/' + id); }
  // ปุ่มที่ล้างข้อมูลต้องกดสองครั้ง (ไม่ใช้ confirm() ของเบราว์เซอร์)
  const armed = {};
  function confirmBtn(k) { if (armed[k] && Date.now() - armed[k] < 4000) { armed[k] = 0; return true; } armed[k] = Date.now(); render(); setTimeout(render, 4100); return false; }
  const lbl = (k, a, b) => (armed[k] && Date.now() - armed[k] < 4000 ? b : a);

  setInterval(() => {
    if (game && game.phase === 'play' && DB.now() > game.endAt + 300) DB.tx('game', (g) => { if (g && g.phase === 'play' && DB.now() > g.endAt) g.phase = 'end'; return g; });
    const el = document.getElementById('mclock');
    if (el && game && game.phase === 'play') el.textContent = DB.now() < game.startAt ? 'นับถอยหลัง' : fmtClock(game.endAt - DB.now());
  }, 500);

  function render() {
    const phase = game ? game.phase : 'lobby';
    const list = rankOf(players, sc);
    const base = new URL(location.href); base.search = '';
    const mk = (role) => { const u = new URL(base); u.searchParams.set('role', role); if (ROOM !== 'ROYALE26') u.searchParams.set('room', ROOM); if (LOCAL) u.searchParams.set('local', '1'); return u.toString(); };
    if (document.activeElement && document.activeElement.id === 'mins') return;
    app.innerHTML = `<div class="mc">
      <div class="pp" style="padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px"><h1 style="white-space:nowrap">🎮 จอควบคุม</h1><span class="tag" style="font-size:12px">SE QUEST · ${esc(ROOM)}</span></div>
      <div class="stat"><div class="pp">สถานะ<b>${phase === 'play' ? 'กำลังเล่น' : phase === 'end' ? 'จบแล้ว' : 'รอเริ่ม'}</b></div><div class="pp">ผู้เล่น<b>${list.length}</b></div><div class="pp">เวลาเหลือ<b id="mclock">${phase === 'play' ? fmtClock(game.endAt - DB.now()) : '-'}</b></div></div>
      ${phase !== 'play' ? `<div class="pp" style="padding:14px;display:grid;gap:12px"><label>ความยาวเกม (นาที) · ถ้า 2 นาทีขึ้นไป นาทีสุดท้ายเป็นนาทีทอง<input id="mins" type="number" min="1" max="30" value="${mins}" inputmode="numeric"></label>
        <button class="btn green" id="go" ${list.length ? '' : 'disabled'}>▶ เริ่มเกม (นับ 3 2 1 · แต้มทุกคนเริ่มที่ 0)</button></div>` : ''}
      ${phase === 'play' ? `<div class="row"><button class="btn cream" id="add1">⏱ ต่อเวลา +1 นาที</button><button class="btn red" id="end">${lbl('end', '⏹ จบเกมเดี๋ยวนี้', 'กดอีกครั้งเพื่อจบ')}</button></div>` : ''}
      ${phase === 'end' ? `<div class="row"><button class="btn" id="replay">🎆 ประกาศผลบนจอใหม่อีกรอบ</button><button class="btn cream" id="lobby">${lbl('lobby', 'กลับหน้ารอ (เก็บรายชื่อไว้)', 'กดอีกครั้งเพื่อยืนยัน')}</button></div>` : ''}
      <div class="row"><button class="btn red" id="wipe">${lbl('wipe', '🧹 ล้างห้อง เริ่มรอบใหม่ทั้งหมด', 'กดอีกครั้ง ลบผู้เล่นทุกคน')}</button></div>
      <div class="pp note">ขั้นตอนต่อรอบ: ล้างห้อง ให้น้องสแกน QR บนจอโชว์ เห็นชื่อครบแล้วกดเริ่มเกม หมดเวลาแล้วจอโชว์ประกาศผล 5 อันดับเอง<br>
      อย่าลืมกดปุ่ม 🔊 บนจอโชว์หนึ่งครั้งเพื่อเปิดเสียง<br>
      จอโชว์: <a href="${mk('screen')}" target="_blank">${esc(mk('screen'))}</a><br>ลิงก์ผู้เล่น: <a href="${mk('player')}" target="_blank">${esc(mk('player'))}</a></div>
      <h1 style="font-size:22px;color:var(--cream);text-shadow:2px 2px 0 var(--brown)">ผู้เล่น (${list.length})</h1>
      <div class="plist">${list.map((r, i) => `<div class="prow">${avImg(r.av)}<span>#${i + 1} ${esc(r.n)} · ${r.s}</span><button class="btn cream" data-k="${esc(r.id)}">เอาออก</button></div>`).join('') || '<div class="pp note">ยังไม่มีผู้เล่น</div>'}</div>
    </div>`;
    const on = (id, f) => { const e = document.getElementById(id); if (e) e.onclick = f; };
    on('go', startGame); on('add1', addMin); on('end', endNow); on('lobby', toLobby); on('wipe', wipe); on('replay', replay);
    app.querySelectorAll('[data-k]').forEach((b) => { b.onclick = () => kick(b.dataset.k); });
  }
  render();
}

/* ================= เลือกบทบาท ================= */
function chooser() {
  const app = document.getElementById('app');
  document.body.insertAdjacentHTML('afterbegin', `<div class="scene-bg" style="background-image:url(${ASSETS.bgScreen})"></div>`);
  const go = (r) => { const u = new URL(location.href); u.searchParams.set('role', r); location.href = u.toString(); };
  app.innerHTML = `<div class="chooser"><div class="chooser-inner">
    <span class="tag" style="font-size:16px">OPEN HOUSE 2026 · ห้อง ${esc(ROOM)}</span>
    <h1 class="logo-title outline"><span class="l1">SE QUEST</span><span class="l2">ตอบให้ไว แกล้งให้มัน</span></h1>
    <div class="roles">
      <button class="pp role" data-r="control"><span class="tag">CONTROL</span><b>จอควบคุม</b><small>เครื่องของสตาฟ เริ่มเกม ต่อเวลา จบเกม ล้างห้อง</small></button>
      <button class="pp role" data-r="screen"><span class="tag">SCREEN</span><b>จอโชว์</b><small>เครื่องที่ต่อโปรเจกเตอร์ โชว์ QR อันดับสด และประกาศผล</small></button>
      <button class="pp role" data-r="player"><span class="tag">PLAYER</span><b>ผู้เล่น</b><small>สำหรับมือถือ ปกติให้สแกน QR บนจอโชว์แทน</small></button>
    </div></div></div>`;
  app.querySelectorAll('[data-r]').forEach((b) => { b.onclick = () => go(b.dataset.r); });
}

Promise.all(AV_IMGS.map((im) => (im.decode ? im.decode().catch(() => {}) : null))).then(function boot() {
  showConn();
  const role = qs.get('role');
  if (role === 'screen') startScreen();
  else if (role === 'control' || role === 'mc') startMC();
  else if (role === 'player') startPlayer();
  else chooser();
});
</script>
